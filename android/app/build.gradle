plugins { id 'com.android.application' }

android {
    namespace 'com.stlouis.y12biology'
    compileSdk 34

    defaultConfig {
        applicationId "com.stlouis.y12biology"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    // St Louis Biology signing key – use the same key for every update
    signingConfigs {
        release {
            storeFile file('keystore/stlouis-biology-key.jks')
            storePassword 'stlouis123'
            keyAlias 'biology'
            keyPassword 'stlouis123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint { abortOnError false; checkReleaseBuilds false }
}
