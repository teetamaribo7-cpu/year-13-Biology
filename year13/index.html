S(4,'Processes and Patterns of Evolution','Sources of variation, natural selection, genetic drift, speciation, isolating mechanisms and patterns of evolution.');
NOTE('Sources of genetic variation',['<b>Meiosis</b> – cell division that makes gametes: two divisions, producing four genetically different haploid cells. <b>Mitosis</b> – one division producing two identical diploid cells (growth, repair).','<b>Crossing over</b> (prophase I) – non-sister chromatids of homologous chromosomes exchange sections, producing new combinations of alleles.','<b>Independent assortment</b> (metaphase I) – homologous pairs line up randomly, so each gamete gets a random mix of maternal and paternal chromosomes (2^n combinations).','<b>Random fertilisation</b> – any sperm can fuse with any egg.','<b>Mutation</b> – the only source of completely new alleles.','Sexual reproduction combines all of these, so offspring vary; variation means some individuals survive new diseases or conditions (e.g. kauri trees resisting kauri dieback).']);
NOTE('Gene pools and natural selection',['<b>Gene pool</b> – all the alleles of all the genes in a population. <b>Allele frequency</b> – how common an allele is in the gene pool (a proportion).','<b>Evolution</b> – a change in allele frequencies in a population over generations.','Darwin’s natural selection: organisms overproduce offspring; individuals vary and variation is inherited; there is a struggle for survival (competition); individuals best suited to the environment survive and reproduce (“survival of the fittest”) and pass on their alleles; over time favourable alleles increase.','<b>Fitness</b> – the ability of an individual to survive and reproduce, passing its alleles on (e.g. albino bullfrogs have low fitness because they are seen and eaten before breeding).','<b>Selection pressure</b> – an environmental factor that affects survival. Biotic: predators, disease, competition, food. Abiotic: temperature, rainfall/drought, salinity, light, pH.','Types: <b>stabilising</b> (favours the average, e.g. human birth weight), <b>directional</b> (favours one extreme, e.g. antibiotic resistance, peppered moths), <b>disruptive</b> (favours both extremes, can lead to speciation).','<b>Sexual selection</b> – selection of traits that increase mating success, through mate choice or competition (peacock tail, deer antlers, bird songs); may reduce survival but increases reproduction.','<b>Artificial selection / selective breeding</b> – humans choose parents with desired traits; reduces genetic diversity and increases inbreeding, so populations become more vulnerable to disease.']);
NOTE('Genetic drift',['<b>Genetic drift</b> – random changes in allele frequencies due to chance, strongest in small populations; alleles can be lost or become fixed.','<b>Founder effect</b> – a few individuals start a new population (e.g. on an island); their gene pool is small and not representative of the original, so some alleles are rare or common by chance (Ellis-van Creveld syndrome in the Amish).','<b>Bottleneck effect</b> – a sudden event (disaster, hunting) drastically reduces population size; survivors carry only part of the original gene pool, so diversity is lost (cheetahs, elephant seals). Endangered species with low diversity struggle to recover.','<b>Gene flow (migration)</b> – movement of alleles between populations.']);
NOTE('Speciation and isolating mechanisms',['<b>Species</b> – organisms that can interbreed to produce fertile offspring. <b>Speciation</b> – formation of new species.','<b>Allopatric speciation</b> – populations separated by a geographical barrier (river, sea, mountain, canyon); they evolve differently and can no longer interbreed (e.g. spotted owls, <i>Rana</i> frogs). <b>Sympatric</b> – in the same area. <b>Instant (polyploidy) speciation</b> – polyploid offspring cannot breed with the parent species, forming a new species in one generation (mostly plants).','<b>Prezygotic isolating mechanisms</b> (prevent fertilisation): geographical/habitat, temporal (breeding at different times – frogs), behavioural (courtship, songs, displays), mechanical (incompatible sex organs), gametic (sperm and egg incompatible).','<b>Postzygotic mechanisms</b> (after fertilisation): hybrid inviability (hybrids die early – sheep × goat embryos), hybrid sterility (mule from horse × donkey: 63 chromosomes cannot pair in meiosis, no functional gametes), hybrid breakdown (F1 fertile but F2 weak or sterile).']);
NOTE('Patterns of evolution',['<b>Divergent evolution / adaptive radiation</b> – a common ancestor gives rise to many species adapted to different niches (Darwin’s finches with different beaks, Hawaiian honeycreepers). Produces <b>homologous structures</b> – same basic structure, different function (pentadactyl limbs of human, cat, whale, bat). Conditions: new habitats/niches, isolation, different selection pressures.','<b>Convergent evolution</b> – unrelated species evolve similar features because they live in similar environments (shark and dolphin body shapes; wings of bat, bird and butterfly). Produces <b>analogous structures</b> – same function, different origin.','<b>Co-evolution</b> – two species evolve in response to each other (Darwin’s orchid and hawkmoth: longer nectar tube ↔ longer tongue; flowers and bees). Mutualistic co-evolution increases specialisation and biodiversity.','<b>Parallel evolution</b> – related species evolve similar traits independently.']);

Q('What type of cell division produces four genetically different haploid gametes?','Meiosis','Mitosis','Binary fission','Budding','Meiosis has two divisions and creates variation.',2019);
Q('A cell divides once to give two identical cells with the same chromosome number. This is…','mitosis','meiosis','crossing over','non-disjunction','Mitosis is for growth and repair.',2021);
Q('Which is a feature of meiosis?','It halves the chromosome number and produces genetically different cells','It produces two identical cells','It only occurs in skin cells','It has one division','Meiosis makes haploid gametes.',2020);
Q('Crossing over is…','the exchange of sections between non-sister chromatids of homologous chromosomes in prophase I','the separation of chromatids in mitosis','fertilisation','a type of mutation that deletes genes','It forms new combinations of alleles.',2022);
Q('Independent assortment means that…','homologous chromosome pairs line up randomly at metaphase I, so gametes get different combinations','chromosomes never separate','genes on one chromosome are always inherited together','all gametes are identical','With n pairs there are 2^n combinations.',2018);
Q('How does independent assortment increase genetic variation?','Each gamete receives a different mixture of maternal and paternal chromosomes','It copies DNA exactly','It stops mutations','It makes identical twins','Random orientation produces many combinations.',2020);
Q('The only source of completely new alleles is…','mutation','crossing over','independent assortment','fertilisation','The others only reshuffle existing alleles.',2018);
Q('How does sexual reproduction increase the survival of a species?','It produces variation, so some offspring can survive new conditions such as disease','It produces identical offspring','It reduces the number of offspring','It prevents mutation','Variation gives natural selection something to act on.',2023);
Q('A gene pool is…','all the alleles of all the genes in a population','the genes of one individual','a pool where fish breed','the DNA in one cell','Large gene pools have more diversity.',2020);
Q('Allele frequency is…','how common an allele is in a population’s gene pool','the number of genes on a chromosome','how often mutations occur','the number of offspring','Usually given as a proportion or percentage.',2022);
Q('Evolution is best defined as…','a change in allele frequencies in a population over generations','an individual changing during its life','the growth of an organism','the extinction of all species','Populations evolve, not individuals.',2021);
Q('Natural selection is…','the process where individuals best suited to their environment survive and reproduce more','humans choosing which animals to breed','random change in allele frequency','mutation of genes','Favourable alleles become more common.',2022);
Q('Which is a key point of Darwin’s theory of natural selection?','Organisms produce more offspring than can survive, and individuals vary','Acquired characteristics are inherited','All individuals are identical','Species never change','Also: struggle for existence, survival of the fittest, inheritance.',2024);
Q('In natural selection, fitness means…','the ability to survive and reproduce, passing on alleles','physical strength','running speed','body size','Biological fitness = reproductive success.',2022);
Q('Albino bullfrogs are eaten before they can breed. Over time the albino allele will…','decrease in frequency in the gene pool','increase in frequency','stay the same','become dominant','Low fitness means fewer copies are passed on.',2022);
Q('Selection pressure is…','an environmental factor that affects which individuals survive and reproduce','the pressure of water','a type of mutation','the number of genes','Examples: predators, disease, drought.',2020);
Q('Which is an ABIOTIC factor that can act as a selective pressure?','Temperature','Predators','Disease','Competition','Abiotic = non-living (also rainfall, salinity, light).',2023);
Q('Which is a BIOTIC selecting agent?','Predators','Rainfall','Temperature','Soil pH','Biotic = living factors.',2020);
Q('Selection that favours one extreme phenotype (e.g. antibiotic resistance) is…','directional selection','stabilising selection','disruptive selection','sexual selection','The population shifts towards one end.','Definition');
Q('Selection that favours the average phenotype (e.g. human birth weight) is…','stabilising selection','directional selection','disruptive selection','artificial selection','Extremes are selected against.',2017);
Q('Selection that favours both extremes and can split a population is…','disruptive selection','stabilising selection','directional selection','genetic drift','It can lead to speciation.',2024);
Q('Sexual selection is…','selection of traits that increase an individual’s success in finding a mate','selection by humans','random mating','the founder effect','E.g. peacock tails, deer antlers.',2019);
Q('Selective breeding (artificial selection) is when…','humans choose parents with desired traits to breed','nature selects the fittest','populations drift by chance','two species hybridise','It changes allele frequencies quickly.',2020);
Q('What is the effect of selective breeding on genetic diversity?','It reduces genetic diversity because only a few chosen parents breed','It greatly increases diversity','It has no effect','It creates new species every generation','Low diversity makes populations vulnerable to disease.',2021);
Q('Genetic drift is…','a random change in allele frequencies due to chance, especially in small populations','a change caused by natural selection','the movement of genes between populations','a type of mutation','Alleles can be lost by chance.',2018);
Q('The founder effect occurs when…','a few individuals start a new population with a small, unrepresentative gene pool','a disaster kills most of a population','two populations mix','humans breed animals','E.g. ladybirds colonising an island; the Amish.',2021);
Q('Ellis-van Creveld syndrome is common among the Amish because of…','the founder effect','the bottleneck effect','natural selection for dwarfism','hybrid sterility','A small founding group carried the allele.',2019);
Q('The bottleneck effect occurs when…','a sudden event drastically reduces a population, leaving a small gene pool','a few individuals leave to colonise an island','mutation rates increase','species interbreed','Genetic diversity is lost (e.g. cheetahs).',2018);
Q('What is the difference between the founder effect and the bottleneck effect?','Founder: a small group starts a new population; bottleneck: an existing population is drastically reduced','They are exactly the same','Founder involves mutation; bottleneck involves natural selection','Bottleneck increases diversity','Both are types of genetic drift that reduce diversity.',2025);
Q('How does a bottleneck affect an endangered species’ recovery?','Low genetic diversity makes it less able to adapt to disease or change','It increases genetic diversity','It creates new alleles quickly','It has no effect','Loss of alleles and inbreeding reduce survival.',2017);
Q('Speciation that occurs because populations are separated by a geographical barrier is…','allopatric speciation','sympatric speciation','instant speciation','co-evolution','The separated populations evolve differently.',2018);
Q('A river forms and splits a forest, and the tree populations on each side become different species. This is…','allopatric speciation','sympatric speciation','convergent evolution','hybrid breakdown','A geographical barrier caused the split.',2021);
Q('A feature of instant (polyploidy) speciation is…','a new species forms in one generation because polyploids cannot breed with the parent species','it takes millions of years','it is common in animals','it needs a geographical barrier','Much more common in plants.',2019);
Q('Two frog species breed in different months (Feb and Apr). This isolating mechanism is…','temporal isolation','behavioural isolation','mechanical isolation','hybrid sterility','Different breeding times prevent mating.',2018);
Q('Birds that do not respond to each other’s courtship songs are separated by…','behavioural isolation','temporal isolation','gametic isolation','hybrid inviability','Different courtship behaviour prevents mating.',2021);
Q('Which is a prezygotic isolating mechanism?','Mechanical isolation (incompatible reproductive organs)','Hybrid sterility','Hybrid inviability','Hybrid breakdown','Prezygotic barriers act before fertilisation.',2023);
Q('Which pair are post-mating but pre-zygotic isolating mechanisms?','Gametic isolation and mechanical/sperm–egg incompatibility','Hybrid sterility and hybrid inviability','Temporal and habitat isolation','Geographical and behavioural isolation','Mating occurs but fertilisation fails.',2020);
Q('A horse and a donkey produce a sterile mule. This isolating mechanism is…','hybrid sterility','hybrid inviability','temporal isolation','behavioural isolation','Mules cannot form functional gametes.',2018);
Q('Why is a mule sterile?','Its 63 chromosomes (from two species) cannot pair properly in meiosis, so it cannot make functional gametes','It has no chromosomes','It is always female','It is tetraploid','Unpaired chromosomes disrupt meiosis.',2025);
Q('Sheep × goat hybrid embryos die early before birth. This mechanism is…','hybrid inviability','hybrid sterility','hybrid breakdown','gametic isolation','The hybrid zygote fails to develop.',2022);
Q('Hybrid breakdown is when…','first-generation hybrids are fertile but their offspring are weak or sterile','hybrids die as embryos','species breed at different times','sperm cannot fertilise eggs','A postzygotic barrier.',2022);
Q('Divergent evolution is…','when a common ancestor gives rise to different species adapted to different environments','when unrelated species become similar','when two species evolve together','random change in small populations','Also called adaptive radiation.',2020);
Q('Darwin’s finches with different beak shapes evolved from one ancestor. This is an example of…','divergent evolution (adaptive radiation)','convergent evolution','co-evolution','the bottleneck effect','Each species adapted to a different food source.',2024);
Q('Homologous structures, such as the pentadactyl limbs of humans, cats, whales and bats…','have the same basic structure but different functions, showing a common ancestor','have different structures but the same function','are found only in birds','show convergent evolution','Evidence of divergent evolution.',2022);
Q('Analogous structures, such as the wings of a bat, butterfly and bird…','have the same function but evolved separately (different origins)','have the same bones','show a close common ancestor','are homologous','They result from convergent evolution.',2021);
Q('Convergent evolution is…','when unrelated species evolve similar features because they live in similar environments','when one ancestor forms many species','when two species evolve together','random drift','Shark and dolphin body shapes are an example.',2017);
Q('Co-evolution is…','when two species evolve in response to each other, e.g. an orchid and its moth pollinator','when unrelated species look alike','the formation of hybrids','selection by humans','Longer nectar tubes select for longer tongues and vice versa.',2019);
Q('How can co-evolution between flowers and pollinators increase biodiversity?','Specialised partnerships lead to new, distinct species of both plants and pollinators','It reduces the number of species','It stops reproduction','It only affects one species','Mutual adaptation drives diversification.',2025);

P('Define evolution and discuss the impact of evolution on survival and the role of variation.','Evolution – a change in allele frequencies of a population over many generations. Variation (from mutation, crossing over, independent assortment, random fertilisation) means individuals differ. When the environment changes, individuals with favourable variations survive and reproduce (natural selection), passing on their alleles. Over time the population becomes better adapted, so the species survives; without variation a population cannot adapt and may become extinct.','2021, 2025');
P('Identify the cell division shown and explain how it affects genetic variation.','Meiosis. Crossing over in prophase I exchanges alleles between homologous chromosomes; independent assortment in metaphase I gives random combinations of maternal and paternal chromosomes; the gametes are all genetically different, and random fertilisation increases variation further.','2019, 2021, 2023, 2025');
P('State one feature of independent assortment and explain how it contributes to variation.','Homologous pairs line up randomly on the equator in metaphase I, independently of other pairs. Each gamete therefore gets a different mix of maternal and paternal chromosomes (2^n combinations, over 8 million in humans), creating variation in offspring.','2020, 2018');
P('Define crossing over and explain why mutation is the major source of new alleles.','Crossing over – exchange of genetic material between non-sister chromatids of homologous chromosomes in prophase I. Mutation changes the DNA base sequence, creating a completely new allele; crossing over and assortment only reshuffle existing alleles. Mutations in gametes are inherited and add variation to the gene pool.','2022, 2018');
P('Discuss the negative impact of mutation on a population, using an example.','Harmful mutations can cause genetic disease and reduce fitness. Example: sickle cell anaemia – a substitution changes one amino acid in haemoglobin, causing sickle-shaped red cells that block capillaries, causing pain, anaemia and early death. Such alleles reduce survival and reproduction in the population (although carriers have some malaria resistance).','2022');
P('Define natural selection and outline two key points of Darwin’s theory.','Natural selection – organisms best suited to their environment survive and reproduce more, passing on their alleles. Key points: (1) organisms produce more offspring than can survive, causing competition; (2) individuals show inherited variation; (3) those with favourable variations survive (survival of the fittest) and reproduce; (4) over generations the population changes.','2022, 2024');
P('Define fitness and explain how fitness contributes to allele frequency (albino bullfrogs).','Fitness – an individual’s ability to survive and reproduce. Albino bullfrogs cannot camouflage and are eaten before breeding, so they pass on few albino alleles. Normally coloured frogs survive and breed, so their alleles become more frequent; the albino allele frequency decreases over generations.','2022, 2018');
P('Define selection pressure and list a biotic and abiotic factor.','Selection pressure – any environmental factor that affects the survival and reproduction of individuals. Biotic: predators, disease, competition. Abiotic: temperature, drought/rainfall, salinity, light.','2020, 2023, 2025');
P('Differentiate between two types of natural selection.','Stabilising selection favours intermediate phenotypes and removes extremes (human birth weight) – variation decreases, mean stays the same. Directional selection favours one extreme (antibiotic-resistant bacteria, dark peppered moths) – the mean shifts. Disruptive selection favours both extremes and may split the population.','2024, 2017');
P('Explain the role of humans and the impact of selective breeding on genetic diversity.','Humans choose parents with desired traits (high milk yield, fast growth) and breed only them over many generations. This rapidly increases the desired alleles but reduces genetic diversity and causes inbreeding; harmful recessive alleles appear more often and the population becomes vulnerable to disease or environmental change.','2020, 2021, 2025');
P('Define genetic drift, the founder effect and the bottleneck effect, and explain their impact on diversity.','Genetic drift – random changes in allele frequency by chance, strongest in small populations. Founder effect – a few individuals colonise a new area; the new gene pool is small and unrepresentative (Amish dwarfism; ladybirds on an island). Bottleneck – a disaster drastically reduces a population; survivors hold only part of the diversity. Both reduce genetic diversity, increase inbreeding and make endangered species less able to adapt and recover.','2018, 2019, 2021, 2023, 2024, 2025, 2017');
P('Define allopatric speciation and explain why geographical/temporal/behavioural isolation leads to speciation.','Allopatric speciation – formation of new species when populations are separated geographically. Once separated (or breeding at different times, or with different courtship), no gene flow occurs between the populations. Each experiences different mutations, selection pressures and drift, so their gene pools diverge. Eventually they cannot interbreed to produce fertile offspring even if they meet – reproductive isolation = new species (spotted owls, Rana frogs).','2018, 2019, 2021, 2023');
P('Discuss how hybrid sterility acts as a barrier to reproduction.','Hybrid sterility is a postzygotic mechanism. Two species mate and produce a hybrid (horse 64 + donkey 62 → mule 63 chromosomes). The hybrid grows, but its chromosomes cannot pair in meiosis, so it cannot produce functional gametes. Hybrids cannot pass genes on, so the gene pools of the parent species remain separate.','2024, 2025, 2020, 2021');
P('Discuss the combined impact of prezygotic and postzygotic isolating mechanisms on speciation.','Prezygotic mechanisms (habitat, temporal, behavioural, mechanical, gametic isolation) prevent mating or fertilisation; postzygotic mechanisms (hybrid inviability, sterility, breakdown) make any hybrids unsuccessful. Together they stop gene flow between populations, preserving each gene pool and allowing populations to accumulate differences until they are separate species.','2017, 2023');
P('Discuss divergent evolution from a common ancestor (Darwin’s finches).','Divergent evolution – one ancestral species gives rise to several species adapted to different niches. Features: homologous structures, many species from one ancestor, adaptive radiation. Conditions: new unoccupied niches, isolation (islands) and different selection pressures (food types). Finches reached the Galápagos, spread to different islands, faced different foods; beak shapes were selected differently (seed-crushing, insect-eating, cactus); populations became reproductively isolated → 13+ species.','2018, 2020, 2023, 2024');
P('Compare and contrast convergent and divergent evolution.','Both are driven by natural selection and adaptation to environments. Divergent: related species become different, from a common ancestor – homologous structures (pentadactyl limbs). Convergent: unrelated species become similar because of similar environments – analogous structures (shark and dolphin, bird and butterfly wings).','2019, 2017, 2021');
P('Define co-evolution and discuss how it increases biodiversity (mutualism).','Co-evolution – reciprocal evolution of two interacting species. Example: Darwin’s orchid and hawkmoth – longer nectar tubes select for moths with longer tongues, which in turn select for even longer tubes; both benefit (nectar vs pollination). Specialised partnerships reduce competition, create new niches and lead to the formation of new species, increasing biodiversity.','2019, 2025');
P('Define sexual selection and discuss its impact on populations.','Sexual selection – selection for traits that increase mating success. Mate choice (females choose males with bright colours, e.g. peacock tail) and male–male competition (deer antlers). Impacts: the traits become more common and exaggerated; differences between sexes increase; traits may reduce survival (visible to predators) but increase reproduction; can contribute to speciation.','2019');
P('Discuss how sexual reproduction causes variation and increases survival (kauri dieback).','Meiosis produces varied gametes through crossing over and independent assortment; random fertilisation combines gametes from different parents. Offspring are genetically different, so some kauri trees may carry alleles that resist dieback. These survive and reproduce, increasing resistance alleles in the population, helping the species survive.','2024, 2017, 2023');
P('Discuss Darwin’s theory of natural selection and its validity.','Darwin proposed overproduction, variation, struggle for existence, survival of the fittest and inheritance leading to change. It is strongly supported by fossils, homologous structures, DNA comparisons and observed evolution (antibiotic resistance, peppered moths, finch beaks). Darwin did not know about genes or mutations; modern genetics has added this (modern synthesis), and processes such as genetic drift also cause evolution, but natural selection remains the main valid explanation of adaptation.','2025');

S(5,'Environmental Issues','Climate change, greenhouse gases, adaptation and mitigation, conservation and renewable energy in the Pacific.');
NOTE('Climate change and global warming',['<b>Greenhouse effect</b> – greenhouse gases (carbon dioxide, methane, nitrous oxide, water vapour, CFCs) trap heat radiated from the Earth. Extra gases from human activity increase it → <b>global warming</b>.','Human activities: burning fossil fuels (vehicles, diesel generators, power stations) releases CO_2; deforestation removes carbon sinks; livestock and rice farming and landfills release methane; fertilisers release nitrous oxide.','Features of climate change: rising air and sea temperatures, sea-level rise, more extreme weather (cyclones, droughts, floods, king tides), ocean acidification, coral bleaching, changing rainfall.','Effects on coral reefs: bleaching (warm water makes corals expel their algae), acidification weakens coral skeletons, stronger storms break reefs, sea-level rise; loss of fish habitat and food for Pacific people.']);
NOTE('Adaptation and mitigation',['<b>Adaptation</b> – adjusting to the effects of climate change to reduce harm: sea walls, relocation to higher ground, raised houses, improved drainage, protected wells and rainwater tanks, salt-tolerant crops (babai), mangrove planting.','Relocation is often the best long-term strategy because it removes people permanently from the danger area, whereas sea walls are costly and can fail or cause erosion elsewhere.','<b>Mitigation</b> – reducing the causes of climate change: cutting greenhouse gas emissions, renewable energy, energy efficiency, planting trees and mangroves (carbon sinks).','Mangroves are a nature-based solution: they absorb CO_2 (blue carbon), protect coasts from waves and erosion, and are nurseries for fish.']);
NOTE('Conservation and renewable energy',['<b>Conservation</b> practices: marine protected areas and tabu areas, fishing limits and closed seasons, replanting mangroves and trees, recycling and reducing waste, protecting endangered species.','<b>Renewable energy</b> comes from sources that are naturally replaced: solar (solar panels – very suitable for Pacific islands), wind, hydropower, wave and tidal, geothermal, biofuel.','<b>Hydropower</b>: water stored behind a dam flows down through pipes, turning turbines connected to generators, which produce electricity.','<b>Biofuel</b> – fuel made from living or recently living material (biomass), e.g. coconut oil biodiesel, ethanol from sugarcane; it is renewable and releases less net CO_2.']);

Q('Which is a greenhouse gas?','Carbon dioxide','Oxygen','Nitrogen','Argon','CO_2, methane, nitrous oxide and water vapour trap heat.',2023);
Q('The greenhouse effect is…','the trapping of heat in the atmosphere by greenhouse gases','the growth of plants in greenhouses','the cooling of the Earth','the destruction of the ozone layer only','Extra greenhouse gases cause global warming.','Definition');
Q('Which human activity increases greenhouse gases?','Burning fossil fuels such as diesel and petrol','Planting mangroves','Using solar panels','Recycling paper','Combustion releases CO_2.',2020);
Q('Which is a feature of climate change?','Rising sea levels and more extreme weather','Colder oceans everywhere','Less rainfall variation','Growing coral reefs','Also higher temperatures and ocean acidification.',2022);
Q('How does climate change affect coral reefs?','Warmer water causes coral bleaching and acidification weakens coral','It makes corals grow faster','It has no effect','It increases fish on reefs','Bleached corals often die.',2021);
Q('In the context of global warming, adaptation means…','adjusting to the effects of climate change to reduce harm','reducing greenhouse gas emissions','stopping all industry','planting crops in greenhouses','Examples: sea walls, relocation, rainwater tanks.',2020);
Q('Mitigation means…','reducing the causes of climate change, such as greenhouse gas emissions','building sea walls only','moving to higher land','studying weather','Renewable energy and tree planting are mitigation.','Definition');
Q('Which is an adaptation to rising sea levels for a coastal settlement?','Relocating to higher ground or building raised houses','Burning more diesel','Removing mangroves','Building houses closer to the sea','Adaptation reduces exposure to harm.',2025);
Q('Why can relocation be the best adaptive strategy for coastal communities?','It permanently removes people from the area at risk','It is the cheapest option in all cases','It stops sea levels rising','It makes the sea wall stronger','Sea walls can fail; relocation avoids the hazard.',2022);
Q('Planting mangroves along the coast is a nature-based solution because mangroves…','protect the coast from waves and absorb carbon dioxide','release greenhouse gases','increase erosion','need no water','They are carbon sinks and fish nurseries.',2024);
Q('Which is a conservation practice?','Setting up marine protected (tabu) areas','Overfishing','Clearing forests','Dumping rubbish in the lagoon','Conservation protects natural resources.',2021);
Q('Which is a renewable source of energy suitable for Kiribati?','Solar energy','Diesel','Coal','Natural gas','Plenty of sunshine makes solar ideal.',2023);
Q('How does hydropower generate electricity?','Flowing water turns turbines connected to generators','Burning water releases energy','Sunlight heats the dam','Wind blows over the reservoir','Moving water’s kinetic energy is converted to electricity.',2024);
Q('A biofuel is…','a fuel made from living or recently living material (biomass), e.g. coconut oil biodiesel','a fossil fuel','nuclear fuel','a type of battery','Biofuels are renewable.',2025);
Q('Which is an action that mitigates climate change?','Replacing diesel generators with solar power','Building sea walls','Raising houses','Relocating villages','Mitigation reduces emissions.',2025);

P('List two effects of climate change on coral reefs.','Coral bleaching due to higher sea temperatures; ocean acidification weakening coral skeletons; stronger cyclones breaking reefs; sea-level rise and sedimentation reducing light.','2021');
P('Name one conservation practice and describe a renewable source of energy with an example.','Conservation: marine protected/tabu areas, mangrove replanting, fishing limits. Renewable: solar energy – solar panels convert sunlight into electricity, e.g. solar farms and household panels in Kiribati; it is never used up and produces no greenhouse gases.','2021, 2023');
P('List two features of climate change and explain why relocation would be the best adaptive strategy.','Features: rising global temperature, sea-level rise, extreme weather, ocean acidification. Relocation moves the community permanently away from flooding, erosion and saltwater intrusion; sea walls and drainage are costly, need maintenance and may fail as sea levels keep rising, so relocation gives long-term safety.','2022');
P('Describe one human activity that increases greenhouse gases / global temperature.','Burning fossil fuels (diesel for generators, petrol for vehicles) releases carbon dioxide, which traps heat; deforestation removes trees that absorb CO_2; livestock and landfills release methane.','2020, 2023');
P('Define adaptation and list two ways your country is adapting to global warming.','Adaptation – actions that reduce the harm caused by climate change. Examples in Kiribati: sea walls and planting mangroves, rainwater tanks and protected wells, raising houses, growing salt-tolerant crops, relocation planning.','2020, 2025');
P('Identify the adaptation method (mangrove planting) and its significance in mitigating global warming.','Mangrove planting. Mangroves absorb and store large amounts of carbon dioxide (blue carbon), reducing greenhouse gases; they also protect the coast from erosion and storm surges and provide fish nurseries.','2024');
P('Describe how hydropower generates electricity and describe a biofuel.','Hydropower: water held behind a dam flows down through pipes, spinning turbines connected to generators that produce electricity. Biofuel: fuel from biomass, e.g. biodiesel from coconut oil or ethanol from sugarcane – renewable and lower in net CO_2.','2024, 2025');
/* ===== Extra definition questions (multiple choice) ===== */
function D(n,term,def,w1,w2,w3){const s=BIO.find(x=>x.n===n);s.mcq.push({q:`Which is the correct definition of <b>${term}</b>?`,o:[def,w1,w2,w3],sol:`${term}: ${def}.`,src:'Definition'});}
D(1,'habituation','learning to ignore a repeated stimulus that is harmless','an inborn reflex','a daily rhythm','a movement towards light');
D(1,'imprinting','rapid learning in a short, sensitive period early in life, e.g. ducklings following their mother','learning by trial and error','a directional response to gravity','a change in speed of movement');
D(1,'klinokinesis','a change in the rate of turning in response to the intensity of a stimulus','a change in speed of movement','movement towards chemicals','a yearly rhythm');
D(1,'migration','a regular, seasonal, long-distance movement of animals between two areas','returning to a nest after feeding','any movement towards light','living in groups');
D(1,'diurnal','active during the day and resting at night','active at night','active at dawn and dusk','active only in winter');
D(1,'nocturnal','active at night and resting during the day','active during the day','active only at noon','never active');
D(1,'circannual rhythm','a rhythm with a cycle of about one year, e.g. breeding or migration','a rhythm of about 24 hours','a rhythm following the tides','a rhythm of about one month');
D(1,'entrainment','the resetting of a biological clock by a zeitgeber so it matches the environmental cycle','losing the biological clock','an animal learning a new skill','moving to a new territory');
D(1,'realised niche','the part of the fundamental niche actually occupied by a species because of competition','the full range of conditions a species could use','the place where an animal sleeps','the food of a predator');
D(1,'intraspecific competition','competition between members of the same species','competition between different species','a relationship where both benefit','the eating of prey');
D(1,'mutualism','a relationship between two species in which both benefit','one species benefits and the other is harmed','one benefits and the other is unaffected','two species competing');
D(1,'dominance hierarchy','a ranking of animals in a group that decides access to food and mates','a line of animals migrating','a food chain','an inherited reflex');
D(1,'r-selected species','species that produce many small offspring with little or no parental care','species with few large offspring and parental care','species that never reproduce','species with no predators');
D(1,'social organisation','the way animals in a group are organised, including roles, hierarchy and cooperation','a single animal living alone','the migration route of birds','the food web of an ecosystem');
D(2,'gene','a section of DNA that codes for a polypeptide (protein)','a whole chromosome','an amino acid','a type of RNA');
D(2,'allele','an alternative form of a gene at the same locus','a whole genome','a chromosome pair','a protein');
D(2,'locus','the position of a gene on a chromosome','the centre of a cell','a type of enzyme','a codon');
D(2,'anticodon','three bases on tRNA that are complementary to an mRNA codon','three bases on DNA','a stop codon','an amino acid');
D(2,'translation','the stage of protein synthesis where the mRNA code is used at the ribosome to join amino acids','copying DNA','making mRNA in the nucleus','cutting DNA');
D(2,'genotype','the alleles an organism has for a characteristic','the observable characteristic','the number of chromosomes','the environment of the organism');
D(2,'phenotype','the observable characteristics of an organism, from its genotype and environment','the alleles only','the DNA sequence','the karyotype');
D(2,'homozygous','having two identical alleles for a gene (e.g. BB or bb)','having two different alleles','having three alleles','having no alleles');
D(2,'incomplete dominance','when the heterozygote shows an intermediate phenotype (e.g. pink flowers)','when both alleles show separately','when one allele masks another completely','when genes are on the X chromosome');
D(2,'frameshift mutation','an insertion or deletion that changes every codon after the mutation','a substitution of one base','an extra chromosome','a silent mutation');
D(2,'silent mutation','a base change that does not change the amino acid coded','a mutation causing a stop codon','a mutation that deletes a gene','a chromosome loss');
D(2,'mutagen','a factor that causes mutations, such as UV light, X-rays or certain chemicals','an enzyme that copies DNA','a type of protein','a harmless mutation');
D(2,'karyotype','a picture of an individual’s chromosomes arranged in pairs by size','a type of cell division','a genetic code table','a DNA profile');
D(2,'trisomy','having three copies of one chromosome instead of two','having three complete sets of chromosomes','losing one chromosome','having three genes');
D(2,'triploid','having three complete sets of chromosomes (3n)','having three copies of one chromosome','having three genes','having three alleles');
D(2,'polygenic inheritance','a characteristic controlled by many genes, giving continuous variation (e.g. height)','one gene controlling many traits','one gene masking another','a gene on the X chromosome');
D(2,'transcription','making a complementary mRNA copy of a gene from DNA','joining amino acids','copying the whole DNA','cutting DNA into pieces');
D(3,'vector (in genetic engineering)','a carrier, such as a plasmid or virus, that transfers a gene into a host cell','an enzyme that cuts DNA','a type of mutation','a DNA band on a gel');
D(3,'sticky ends','short single-stranded ends of DNA left by some restriction enzymes that can pair with complementary ends','the ends of chromosomes','the start codon','the ends of a gel');
D(3,'transgenic organism (GMO)','an organism that contains a gene from another species','an organism produced by selective breeding','a cloned organism with no changes','a hybrid of two species');
D(3,'primer (in PCR)','a short piece of DNA that binds to the start of the target sequence so polymerase can copy it','an enzyme that cuts DNA','a heat-resistant protein','the gel used in electrophoresis');
D(3,'Taq polymerase','a heat-stable DNA polymerase used in PCR','an enzyme that cuts DNA','an enzyme that joins DNA','a bacterial plasmid');
D(3,'DNA profiling','identifying individuals from the unique pattern of their DNA fragments (e.g. STRs)','copying a gene many times','inserting a gene into another species','counting chromosomes');
D(3,'biolistics','inserting DNA into cells by firing DNA-coated metal particles with a gene gun','cutting DNA with enzymes','growing bacteria','separating DNA by size');
D(3,'transformation (bacteria)','the uptake of foreign DNA, such as a recombinant plasmid, by a cell','the cutting of DNA','cell division','the separation of DNA strands');
D(4,'species','a group of organisms that can interbreed to produce fertile offspring','any group of animals in one place','organisms with the same colour','a population of one sex');
D(4,'speciation','the formation of new species','the extinction of species','the naming of species','random mating');
D(4,'population','a group of organisms of the same species living in the same area','all species in an area','one individual','the gene pool');
D(4,'adaptive radiation','the rapid evolution of many species from a common ancestor, each adapted to a different niche','two unrelated species becoming similar','the spread of radiation','a bottleneck event');
D(4,'reproductive isolation','the inability of two populations to interbreed and produce fertile offspring','living on different islands only','reproducing asexually','sharing the same gene pool');
D(4,'gene flow','the movement of alleles between populations when individuals migrate and breed','a mutation in one gene','random change in allele frequency','the flow of blood');
D(4,'sympatric speciation','formation of new species within the same geographical area','speciation after a geographical barrier','co-evolution','extinction');
D(4,'directional selection','selection that favours one extreme phenotype, shifting the population mean','selection for the average','selection for both extremes','random change');
D(4,'homologous structures','structures with the same basic plan but different functions, showing common ancestry','structures with the same function but different origins','organs that are no longer used','structures found only in plants');
D(4,'vestigial structure','a reduced structure with little or no function, inherited from an ancestor (e.g. human appendix)','a newly evolved organ','an analogous structure','a type of mutation');
D(4,'haploid','a cell with one set of chromosomes (n), such as a gamete','a cell with two sets of chromosomes','a cell with no nucleus','a cell with four sets');
D(4,'diploid','a cell with two sets of chromosomes (2n)','a cell with one set','a gamete','a cell with three sets');
D(5,'carbon sink','something that absorbs and stores more carbon dioxide than it releases, e.g. forests, mangroves, oceans','a factory that releases CO_2','a type of fossil fuel','a sea wall');
D(5,'fossil fuel','a non-renewable fuel formed from ancient organisms, e.g. coal, oil, natural gas','a fuel made from coconuts','solar energy','wind energy');
D(5,'renewable energy','energy from sources that are naturally replaced and will not run out','energy from coal and oil','energy that is used only once','nuclear waste');
D(5,'ocean acidification','a fall in seawater pH as the ocean absorbs more carbon dioxide','the ocean becoming more salty','the ocean cooling down','plastic pollution');
D(5,'coral bleaching','corals turning white after expelling their algae because of stress such as warm water','corals growing faster','corals changing colour to attract fish','corals being cleaned by fish');
D(5,'sustainability','using resources in a way that meets present needs without harming future generations','using all resources quickly','never using resources','only using fossil fuels');
D(5,'global warming','the increase in Earth’s average temperature due to extra greenhouse gases','the ozone hole','cooling of the oceans','seasonal change');
D(5,'king tide','an especially high tide that causes coastal flooding','a tide that only occurs in rivers','a very low tide','a tsunami');
/* ================= YEAR 13 REVISION BIOLOGY – app ================= */
const SCOL={1:'var(--s1)',2:'var(--s2)',3:'var(--s3)',4:'var(--s4)',5:'var(--s5)'};
const ICON={1:'🦎',2:'🧬',3:'🧪',4:'🦜',5:'🌏'};
const MCQ={};
BIO.forEach(s=>{s.mcq.forEach((q,i)=>{q.id=`b${s.n}-${i}`;q.s=s;q.def=q.src==='Definition'||/^(What is|What are)\b/.test(q.q)||/(is|are|means)…$/.test(q.q);MCQ[q.id]=q;});});
let best={},miss={};
try{best=JSON.parse(localStorage.getItem('y13-best')||'{}')||{};}catch(e){}
try{miss=JSON.parse(localStorage.getItem('y13-miss')||'{}')||{};}catch(e){}
Object.keys(miss).forEach(id=>{if(!MCQ[id])delete miss[id];});
const saveB=()=>{try{localStorage.setItem('y13-best',JSON.stringify(best));}catch(e){}};
const saveM=()=>{try{localStorage.setItem('y13-miss',JSON.stringify(miss));}catch(e){}};
function fmt(s){return String(s).replace(/_\{([^}]+)\}/g,'<sub>$1</sub>').replace(/_(\d+|[a-z]|[A-Z](?![a-zA-Z]))/g,'<sub>$1</sub>').replace(/\^\{([^}]+)\}/g,'<sup>$1</sup>').replace(/\^(\d+|[+\-−n])/g,'<sup>$1</sup>');}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function shuffle(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]];}return a;}
function bestTxt(k){const b=best[k];return b?`Best ${b.s}/${b.n}`:'Not tried';}
function gradeOf(p){return p>=80?['Excellent!','You are well prepared for this strand.']:p>=65?['Very good','Revise the questions you missed.']:p>=50?['Pass','Read the notes again and retest your mistakes.']:['Keep practising','Study the notes and the past-paper solutions, then try again.'];}
function srcTag(src){return src==='Definition'?'Definition':`SPFSC ${src}`;}
const app=document.getElementById('app'),titleEl=document.getElementById('title'),backBtn=document.getElementById('back');
function setHead(t,col){titleEl.textContent=t;backBtn.classList.toggle('on',location.hash.length>2);col?app.style.setProperty('--c',col):app.style.removeProperty('--c');}
function row(html,onclick,col){const b=document.createElement('button');b.className='topic';if(col)b.style.setProperty('--c',col);b.innerHTML=html;b.onclick=onclick;return b;}
const strand=n=>BIO.find(s=>s.n==n);

function home(){
  setHead('Year 13 Revision Biology');
  const tot=BIO.reduce((a,s)=>a+s.mcq.length,0),pp=BIO.reduce((a,s)=>a+s.past.length,0);
  app.innerHTML=`<section class="hero"><h2>Year 13 Revision Biology</h2><p>Notes, ${tot} multiple-choice questions and ${pp} past exam questions with solutions, from the SPFSC Biology papers 2017–2025.</p></section><div id="list"></div>
  <div class="tools"><button class="pill main" id="mix">Mixed exam practice: 25 questions</button><button class="pill" id="mis">My mistakes (${Object.keys(miss).length})</button><button class="pill" id="rst">Reset my progress</button></div>
  <footer>St Louis High School. Created by the Biology Teacher. Progress is saved on this device only.</footer>`;
  const list=app.querySelector('#list');
  BIO.forEach(s=>list.appendChild(row(`<b><span style="color:var(--c)">${ICON[s.n]} Strand ${s.n}</span><br>${s.name}</b><span class="n">${s.mcq.length} MCQs<br>${s.past.length} past questions</span>`,()=>go(`#/s/${s.n}`),SCOL[s.n])));
  app.querySelector('#mix').onclick=()=>go('#/mix');app.querySelector('#mis').onclick=()=>go('#/mistakes');app.querySelector('#rst').onclick=()=>go('#/reset');
}
function strandView(n){
  const s=strand(n);if(!s)return home();setHead(`Strand ${n}`,SCOL[n]);
  const defs=s.mcq.filter(q=>q.def).length,mc=Object.keys(miss).filter(id=>MCQ[id]&&MCQ[id].s===s).length;
  app.innerHTML=`<div class="thead"><div class="sub">${ICON[n]} Strand ${n}</div><h2>${s.name}</h2><div class="small">${esc(s.desc)}</div></div>
  <div class="grid4">
   <button class="bigbtn notes" id="b1"><span class="ic">📖</span>Notes<small>Key ideas and definitions</small></button>
   <button class="bigbtn quiz" id="b2"><span class="ic">✅</span>Full quiz<small>${s.mcq.length} questions · ${bestTxt(`s${n}-all`)}</small></button>
   <button class="bigbtn notes" id="b3"><span class="ic">🔤</span>Definitions quiz<small>${defs} questions · ${bestTxt(`s${n}-def`)}</small></button>
   <button class="bigbtn notes" id="b4"><span class="ic">📝</span>Past exam questions<small>${s.past.length} with solutions</small></button>
  </div>
  <div class="tools"><button class="pill" id="b5">Quick test: 10 random</button><button class="pill" id="b6">My Strand ${n} mistakes (${mc})</button></div>`;
  const on=(id,h)=>app.querySelector(id).onclick=()=>go(h);
  on('#b1',`#/n/${n}`);on('#b2',`#/q/${n}/all`);on('#b3',`#/q/${n}/def`);on('#b4',`#/p/${n}`);on('#b5',`#/q/${n}/10`);on('#b6',`#/mistakes/${n}`);
}
function notesView(n){
  const s=strand(n);if(!s)return home();setHead(`Notes – Strand ${n}`,SCOL[n]);
  app.innerHTML=`<div class="thead"><div class="sub">${ICON[n]} Strand ${n}</div><h2>${s.name}: notes</h2><div class="small">Key terms are in bold. Learn the definitions – many exam questions start with “Define…”.</div></div>
  ${s.notes.map(([h,pts])=>`<section class="nsec"><h3>${h}</h3><ul>${pts.map(p=>`<li>${fmt(p)}</li>`).join('')}</ul></section>`).join('')}
  <div class="nav" style="margin-top:22px"><button class="go" id="qz">Start the Strand ${n} quiz</button><button id="pp">Past exam questions</button></div>`;
  app.querySelector('#qz').onclick=()=>go(`#/q/${n}/all`);app.querySelector('#pp').onclick=()=>go(`#/p/${n}`);
}
function pastView(n,yr){
  const s=strand(n);if(!s)return home();setHead(`Past questions – Strand ${n}`,SCOL[n]);
  const years=[...new Set(s.past.flatMap(p=>p.years.split(',').map(x=>x.trim())))].sort();
  const list=s.past.filter(p=>!yr||p.years.split(',').map(x=>x.trim()).includes(yr));
  app.innerHTML=`<div class="thead"><div class="sub">${ICON[n]} Strand ${n} · SPFSC Biology</div><h2>Past exam questions and solutions</h2><div class="small">Write your answer first, then tap “Show solution” and compare. Similar questions from different years are grouped together.</div>
  <div class="chips"><button class="chip ${!yr?'on':''}" data-y="">All years</button>${years.map(y=>`<button class="chip ${yr===y?'on':''}" data-y="${y}">${y}</button>`).join('')}</div></div><div id="list"></div>`;
  app.querySelectorAll('.chip').forEach(c=>c.onclick=()=>go(`#/p/${n}${c.dataset.y?'/'+c.dataset.y:''}`));
  const box=app.querySelector('#list');
  if(!list.length)box.innerHTML='<p class="empty">No questions from this year in this strand.</p>';
  list.forEach((p,i)=>{const el=document.createElement('article');el.className='q';el.style.setProperty('--c',SCOL[n]);
    el.innerHTML=`<div class="meta"><span>Q${i+1}</span><span class="tag g">SPFSC ${esc(p.years)}</span></div><p class="txt">${fmt(p.q)}</p><button class="reveal">Show solution</button><div class="sl"></div>`;
    el.querySelector('.reveal').onclick=e=>{e.target.remove();el.querySelector('.sl').innerHTML=`<div class="ans"><span class="lbl">Model solution</span>${fmt(p.a)}</div>`;};
    box.appendChild(el);});
}
function startQuiz(n,which){
  const s=strand(n);if(!s)return home();let pool=s.mcq,name=`Strand ${n} quiz`;
  if(which==='def'){pool=s.mcq.filter(q=>q.def);name=`Strand ${n} definitions`;}
  else if(which==='10'){pool=shuffle(s.mcq).slice(0,10);name=`Strand ${n} quick test`;}
  runQuiz(pool,name,`s${n}-${which}`,SCOL[n],`#/s/${n}`,`Back to Strand ${n}`,()=>startQuiz(n,which));
}
function startMix(){const pool=shuffle(Object.values(MCQ)).slice(0,25);runQuiz(pool,'Mixed exam practice','mix','var(--focus)','#/','Back to home',startMix);}
function runQuiz(pool,name,key,col,backRoute,backLabel,again){
  setHead(name,col);
  const qs=shuffle(pool).map(q=>({src:q,opts:shuffle(q.o.map((txt,i)=>({txt,right:i===0})))}));
  const ans=[];let idx=0,score=0;
  function draw(){
    const q=qs[idx],picked=ans[idx];
    app.innerHTML=`<div class="quizbar"><span>Question ${idx+1} of ${qs.length}</span><span class="small">Score: ${score} · Strand ${q.src.s.n} · ${srcTag(q.src.src)}</span></div>
    <div class="meter" style="margin-bottom:14px"><i style="width:${(idx+1)/qs.length*100}%"></i></div>
    <article class="q" style="--c:${SCOL[q.src.s.n]}"><p class="txt">${fmt(q.src.q)}</p><div class="opts"></div><div id="fb"></div></article><div class="nav" id="nav"></div>`;
    const box=app.querySelector('.opts');
    q.opts.forEach((o,i)=>{const b=document.createElement('button');b.className='opt';b.innerHTML=`<b>${'ABCD'[i]}.</b> ${fmt(o.txt)}`;
      if(picked!==undefined){b.disabled=true;if(o.right)b.classList.add('right');else if(i===picked)b.classList.add('wrong');}
      b.onclick=()=>{if(ans[idx]!==undefined)return;ans[idx]=i;if(o.right)score++;draw();};box.appendChild(b);});
    if(picked!==undefined){
      const ok=q.opts[picked].right;
      app.querySelector('#fb').innerHTML=(ok?'<p class="fb ok">✓ Correct!</p>':`<p class="fb no">✗ Wrong. Correct answer: <b>${fmt(q.opts.find(o=>o.right).txt)}</b></p>`)+`<div class="ans"><span class="lbl">Solution</span>${fmt(q.src.sol)}</div>`;
      const nx=document.createElement('button');nx.className='go';nx.textContent=idx===qs.length-1?'See my mark':'Next question';
      nx.onclick=()=>{if(idx<qs.length-1){idx++;draw();window.scrollTo(0,0);}else result();};app.querySelector('#nav').appendChild(nx);
    }
  }
  function result(){
    const today=new Date().toISOString().slice(0,10);let fixed=0;
    qs.forEach((q,i)=>{const ok=q.opts[ans[i]].right,id=q.src.id;
      if(ok){if(miss[id]){delete miss[id];fixed++;}}else{const p=miss[id];miss[id]={yours:q.opts[ans[i]].txt,n:(p?p.n:0)+1,d:today};}});
    saveM();
    const n=qs.length,pct=Math.round(score/n*100),wrong=n-score;
    if(key){const p=best[key];if(!p||score/n>p.s/p.n){best[key]={s:score,n};saveB();}}
    const [g,msg]=gradeOf(pct);
    app.innerHTML=`<div class="thead"><div class="sub">${esc(name)}</div><p class="score">${score}/${n}</p><h2 style="margin-top:8px">${pct}% – ${g}</h2>
    <p class="small">${msg} ${wrong?`${wrong} wrong answer${wrong>1?'s were':' was'} saved in My mistakes.`:'No mistakes this time!'}${fixed?` ${fixed} old mistake${fixed>1?'s were':' was'} fixed.`:''}</p>
    <div class="nav"><button class="go" id="again">Try again</button><button id="bk">${esc(backLabel)}</button></div>
    <div class="tools"><button class="pill" id="mis">My mistakes (${Object.keys(miss).length})</button></div></div>
    ${wrong?'<h3 style="font-family:var(--serif);margin:26px 0 10px">Questions you got wrong</h3>':''}<div id="rev"></div>`;
    const rev=app.querySelector('#rev');
    qs.forEach((q,i)=>{if(q.opts[ans[i]].right)return;const el=document.createElement('article');el.className='q';el.style.setProperty('--c',SCOL[q.src.s.n]);
      el.innerHTML=`<p class="txt">${fmt(q.src.q)}</p><div class="ans" style="border-color:var(--bad)"><span class="lbl" style="color:var(--bad)">Your answer</span>${fmt(q.opts[ans[i]].txt)}</div><div class="ans" style="border-color:var(--good)"><span class="lbl" style="color:var(--good)">Correct answer and solution</span><b>${fmt(q.opts.find(o=>o.right).txt)}</b><br>${fmt(q.src.sol)}</div>`;rev.appendChild(el);});
    app.querySelector('#again').onclick=again;app.querySelector('#bk').onclick=()=>go(backRoute);app.querySelector('#mis').onclick=()=>go('#/mistakes');
    window.scrollTo(0,0);
  }
  draw();
}
function mistakesView(n){
  const s=n&&strand(n);setHead(s?`Mistakes – Strand ${n}`:'My mistakes',s?SCOL[n]:null);
  const ids=Object.keys(miss).filter(id=>!s||MCQ[id].s===s);
  app.innerHTML=`<div class="thead"><h2>${s?`My Strand ${n} mistakes`:'My mistakes'}</h2><div class="small">${ids.length} question${ids.length===1?'':'s'} you answered wrongly. Study the solutions, then retest. A question leaves this list when you get it right.</div>
  ${ids.length?'<div class="tools"><button class="pill main" id="retry">Retest these mistakes</button></div>':''}</div><div id="list"></div>`;
  const list=app.querySelector('#list');
  if(!ids.length){list.innerHTML='<p class="empty">No mistakes saved yet. Do a quiz – any question you get wrong is collected here.</p>';return;}
  app.querySelector('#retry').onclick=()=>go(s?`#/retry/${n}`:'#/retry');
  let last='';
  ids.sort((a,b)=>MCQ[a].s.n-MCQ[b].s.n||miss[b].n-miss[a].n).forEach(id=>{const q=MCQ[id],m=miss[id],head=`Strand ${q.s.n}: ${q.s.name}`;
    if(head!==last){const h=document.createElement('h3');h.style.cssText='font-size:16px;margin:24px 0 10px;color:'+SCOL[q.s.n];h.textContent=head;list.appendChild(h);last=head;}
    const el=document.createElement('article');el.className='q';el.style.setProperty('--c',SCOL[q.s.n]);
    el.innerHTML=`<div class="meta"><span>${srcTag(q.src)}</span><span class="st no">Missed ${m.n} time${m.n>1?'s':''}</span></div><p class="txt">${fmt(q.q)}</p>
    <div class="ans" style="border-color:var(--bad)"><span class="lbl" style="color:var(--bad)">Your last answer</span>${fmt(m.yours)}</div>
    <div class="ans" style="border-color:var(--good)"><span class="lbl" style="color:var(--good)">Correct answer and solution</span><b>${fmt(q.o[0])}</b><br>${fmt(q.sol)}</div>
    <div class="mark"><button class="ok">I have learned this – remove it</button></div>`;
    el.querySelector('.ok').onclick=()=>{delete miss[id];saveM();mistakesView(n);};list.appendChild(el);});
}
function retry(n){const pool=Object.keys(miss).filter(id=>!n||MCQ[id].s.n==n).map(id=>MCQ[id]);if(!pool.length)return go('#/mistakes');
  runQuiz(pool,'Retest my mistakes',null,'var(--focus)',n?`#/mistakes/${n}`:'#/mistakes','Back to My mistakes',()=>retry(n));}
function resetAll(){if(confirm('Clear all your scores and mistakes on this phone?')){best={};miss={};saveB();saveM();alert('Your progress has been cleared.');}
  if(window.Android){Android.close();return;}go('#/');}
function go(h){location.hash=h;}
function route(){
  const h=location.hash.split('/');
  switch(h[1]){
    case 's':strandView(h[2]);break;
    case 'n':notesView(h[2]);break;
    case 'p':pastView(h[2],h[3]);break;
    case 'q':startQuiz(h[2],h[3]);break;
    case 'mix':startMix();break;
    case 'mistakes':mistakesView(h[2]);break;
    case 'retry':retry(h[2]);break;
    case 'reset':resetAll();break;
    default: if(window.Android&&(window.__opened||location.hash.length>2)){Android.close();return;} home();
  }
  window.__opened=1;window.scrollTo(0,0);
}
backBtn.onclick=()=>{const h=location.hash.split('/');
  if(['n','p','q'].includes(h[1]))go(`#/s/${h[2]}`);else if(h[1]==='retry')go(h[2]?`#/mistakes/${h[2]}`:'#/mistakes');else if(h[1]==='mistakes'&&h[2])go(`#/s/${h[2]}`);else go('#/');};
window.addEventListener('hashchange',route);
const root=document.documentElement;
try{const th=localStorage.getItem('y13-theme');if(th)root.dataset.theme=th;}catch(e){}
document.getElementById('themeBtn').onclick=()=>{const dark=root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;root.dataset.theme=dark?'light':'dark';try{localStorage.setItem('y13-theme',root.dataset.theme)}catch(e){}};
route();
</script></body></html>
