<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Year 13 Revision Biology</title>
<style>
:root{
  --ink:#12303a; --ink2:#4a6670; --paper:#fbfcfc; --surface:#eef5f5; --line:#d3e3e4;
  --bio:#2f7d4a; --skill:#0f7c8c; --s1:#0f7c8c; --s2:#7a4cc2; --s3:#1f5fbf; --s4:#2f7d4a; --s5:#b86e00; --chem:#7a4cc2; --phys:#b86e00; --good:#1f7a45; --bad:#b3261e; --focus:#0a7ea4;
  --serif:Charter,"Bitstream Charter","Iowan Old Style",Georgia,"Times New Roman",serif;
  --sans:"Avenir Next","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#e3eef0; --ink2:#9db6bd; --paper:#0f1d22; --surface:#172a31; --line:#28424b;
  --bio:#6cc48c; --skill:#4fc3d1; --s1:#4fc3d1; --s2:#b596ee; --s3:#7fb0ff; --s4:#6cc48c; --s5:#f0ad45; --chem:#b596ee; --phys:#f0ad45; --good:#6fd39a; --bad:#ff8a80; --focus:#5cc8ea;}}
:root[data-theme="dark"]{
  --ink:#e3eef0; --ink2:#9db6bd; --paper:#0f1d22; --surface:#172a31; --line:#28424b;
  --bio:#6cc48c; --skill:#4fc3d1; --s1:#4fc3d1; --s2:#b596ee; --s3:#7fb0ff; --s4:#6cc48c; --s5:#f0ad45; --chem:#b596ee; --phys:#f0ad45; --good:#6fd39a; --bad:#ff8a80; --focus:#5cc8ea;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 18px 64px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar{max-width:760px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:10px}
.back{border:0;background:none;padding:6px 8px 6px 0;font-weight:600;color:var(--focus);display:none}
.back.on{display:inline-block}
.bar h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px}
/* home hero */
.hero{padding:34px 0 8px}
.hero h2{font-family:var(--serif);font-weight:700;font-size:clamp(30px,7vw,44px);line-height:1.08;margin:0 0 10px;letter-spacing:-.01em}
.hero p{margin:0;color:var(--ink2);max-width:34em}
.wave{display:block;width:100%;height:28px;margin:18px 0 6px;color:var(--line)}
.seg{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px;margin:18px 0 22px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:10px;font-weight:600;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line)}
.term{display:flex;align-items:stretch;width:100%;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:16px;margin:0 0 12px;padding:0;overflow:hidden}
.term .band{width:10px;background:var(--c)}
.term .in{flex:1;padding:16px 16px 14px}
.term .t1{font-size:13px;color:var(--ink2)}
.term .t2{font-family:var(--serif);font-size:24px;font-weight:700;margin:2px 0 8px;color:var(--c)}
.meter{height:6px;background:var(--surface);border-radius:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--c);width:0}
.small{font-size:14px;color:var(--ink2)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:26px 0 8px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:600;font-size:15px}
.pill.main{background:var(--c,var(--ink));border-color:transparent;color:var(--paper)}
/* topics */
.thead{padding:26px 0 10px}
.thead .sub{color:var(--c);font-weight:700;font-size:14px}
.thead h2{font-family:var(--serif);font-size:30px;margin:2px 0 6px;line-height:1.15}
.topic{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:15px 2px}
.topic b{font-weight:600}
.topic .n{flex:none;font-size:14px;color:var(--ink2);text-align:right}
.done{color:var(--good);font-weight:700}
/* questions */
.q{border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;margin:0 0 14px;background:var(--paper)}
.q .meta{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink2);margin-bottom:6px}
.tag{border-radius:6px;padding:1px 7px;font-weight:600;font-size:12px;border:1px solid var(--line)}
.tag.g{background:var(--surface)}
.tag.x{border-style:dashed}
.q .txt{font-family:var(--serif);font-size:18px;line-height:1.55;margin:0 0 12px}
.opts{display:grid;gap:8px;margin:0 0 10px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
.opt.chosen{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--paper));font-weight:600;box-shadow:inset 0 0 0 1px var(--c)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--paper));font-weight:600}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--paper))}
.reveal{border:1px solid var(--c);color:var(--c);background:none;border-radius:10px;padding:8px 14px;font-weight:600}
.ans{border-left:4px solid var(--c);background:var(--surface);border-radius:0 10px 10px 0;padding:12px 14px;margin:4px 0 12px;line-height:1.6}
.ans .lbl{font-weight:700;font-size:14px;color:var(--c);display:block;margin-bottom:2px}
.mark{display:flex;gap:8px;flex-wrap:wrap}
.mark button{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 12px;font-size:15px}
.mark button[aria-pressed="true"].ok{border-color:var(--good);color:var(--good);font-weight:700}
.mark button[aria-pressed="true"].no{border-color:var(--bad);color:var(--bad);font-weight:700}
.st{margin-left:auto;font-weight:700}
.st.ok{color:var(--good)} .st.no{color:var(--bad)}
.fb{margin:6px 0 0;padding:10px 12px;border-radius:10px;font-weight:600;line-height:1.5}
.fb.ok{color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--paper))}
.fb.no{color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--paper))}
.opt:disabled{cursor:default;color:var(--ink);opacity:1}
.topic b span{font-size:14px}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
.chip.on{background:var(--c);color:var(--paper);border-color:transparent}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.bigbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border-radius:16px;padding:16px;font-weight:700;font-size:18px;border:2px solid var(--c)}
.bigbtn.notes{background:var(--paper);color:var(--c)}
.bigbtn.quiz{background:var(--c);color:var(--paper)}
.bigbtn .ic{font-size:26px;line-height:1}
.bigbtn small{font-weight:500;font-size:13px;opacity:.9}
.nsec{border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px;padding:14px 16px 6px;margin:0 0 14px;background:var(--paper)}
.nsec h3{font-family:var(--serif);font-size:20px;margin:0 0 6px;color:var(--c)}
.nsec ul{margin:0;padding-left:20px}
.nsec li{margin:0 0 8px;line-height:1.55}
.search{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);margin:8px 0 18px}
.empty{padding:30px 0;color:var(--ink2)}
.quizbar{display:flex;flex-direction:column;gap:2px;margin:20px 0 12px;font-weight:600}
.nav{display:flex;gap:10px;margin-top:6px}
.nav button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;font-weight:600}
.nav button.go{background:var(--c);color:var(--paper);border-color:transparent}
.score{font-family:var(--serif);font-size:56px;font-weight:700;color:var(--c);margin:10px 0 0;line-height:1}
footer{margin-top:40px;font-size:13px;color:var(--ink2)}
sub,sup{font-size:.72em;line-height:0}
@media (prefers-reduced-motion:no-preference){.ans{animation:in .18s ease-out}@keyframes in{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}}
</style>

/* ================= STRAND 1 ================= */
S(1,'Animal Behaviour','How animals respond to their environment, biological rhythms, interactions, reproductive strategies and social behaviour.');
NOTE('Innate and learned behaviour',['<b>Innate behaviour</b> is inherited (genetically controlled), performed correctly the first time without learning, and is the same in all members of a species, e.g. reflexes, taxis, kinesis, the honeybee waggle dance, a newborn suckling, monarch butterfly migration.','<b>Learned behaviour</b> develops through experience and can change, e.g. birds improving nest-building, habituation, imprinting, conditioning, trial-and-error, insight and copying others.']);
NOTE('Orientation: taxis and kinesis',['<b>Taxis</b> – a directional movement towards (positive) or away from (negative) a stimulus. Examples: euglena swimming towards light (positive phototaxis); maggots turning away from light (negative phototaxis) by comparing light intensity on each side.','<b>Kinesis</b> – a non-directional response: the speed of movement (<b>orthokinesis</b>) or rate of turning (<b>klinokinesis</b>) changes with the intensity of the stimulus. Example: woodlice or bugs under a lifted rock move faster in dry/bright/hot conditions and slow down when conditions are favourable.','Adaptive value: animals end up in favourable conditions (dark, damp, correct temperature), avoiding drying out and predators.']);
NOTE('Biological rhythms and clocks',['A <b>biological clock</b> is an internal (endogenous) timing mechanism that controls rhythmic activities. <b>Circadian rhythm</b> – a cycle of about 24 hours (sleep–wake). Others: circatidal (tides), lunar (moon, e.g. coral spawning on a full moon), circannual (yearly, e.g. migration, breeding).','<b>Endogenous</b> – generated inside the organism; continues in constant conditions. <b>Exogenous</b> – driven by outside cues.','<b>Zeitgeber</b> (“time-giver”) – an environmental cue such as light/dark, temperature or tides that resets the clock each day (<b>entrainment</b>).','<b>Free-running period</b> – the natural length of the rhythm in constant conditions (e.g. constant darkness); if longer than 24 h, activity starts a little later each day, giving a sloping actogram.','<b>Phase shift</b> – a change (advance or delay) in the timing of the rhythm, e.g. when the light cycle changes or after travel (jet lag).','An <b>actogram</b> plots activity against time for successive days. Diurnal = active in the day; nocturnal = active at night; crepuscular = dawn and dusk.','Benefits of an endogenous clock: anticipates changes (prepares before dawn/dusk), keeps activity at the best time even when cues are absent (e.g. hermit crab in a burrow), synchronises breeding (coral mass spawning), and allows sun-compass navigation.']);
NOTE('Navigation, homing and migration',['<b>Migration</b> – regular, seasonal, long-distance movement between two areas (e.g. monarch butterfly Canada → Mexico, triggered by shorter day length and cooler temperatures).','<b>Homing</b> – the ability to return to a specific place, e.g. salmon return to their birth stream using the Earth’s magnetic field and then smell.','Navigation cues: sun compass (needs a biological clock to allow for the sun’s movement), stars, Earth’s magnetic field, landmarks, smell.']);
NOTE('Interactions between organisms',['<b>Ecological niche</b> – the role and position of a species in its ecosystem: its habitat, food, activity time and interactions. Fundamental niche = the full potential niche; realised niche = the part actually used because of competition.','Coconut crab niche: large land crab, mostly nocturnal, lives in burrows/crevices, climbs trees, feeds on coconuts, fruit and carrion (scavenger).','<b>Intraspecific competition</b> – between members of the same species. <b>Interspecific competition</b> – between different species for the same resource (e.g. eagle and fox fighting for a rabbit).','<b>Competitive exclusion principle</b> (Gause): two species with exactly the same niche cannot coexist – one outcompetes the other (<i>Paramecium aurelia</i> outcompetes <i>P. caudatum</i> when grown together).','<b>Resource partitioning / niche differentiation</b> – species share an area by using different parts of it (e.g. 15 species of anole lizard in different microhabitats). Competition can also cause species redistribution (the weaker competitor moves to a new area).','<b>Predator–prey cycles</b>: prey numbers rise, then predators rise (after a lag), prey fall, then predators fall.','<b>Mutualism</b> – both benefit (bees and flowers: food vs pollination; if bees disappear, plant reproduction and population fall). <b>Commensalism</b> – one benefits, other unaffected. <b>Parasitism</b> – one benefits, other harmed. Invasive species (e.g. African tulip in Fiji) outcompete native species.']);
NOTE('Reproductive strategies and mating',['<b>r-selected species</b>: many small offspring, little or no parental care, high death rate, early maturity, short life, unstable environments (oysters, mice, insects). Success through numbers.','<b>K-selected species</b>: few large offspring, long gestation, much parental care, long life, stable populations near carrying capacity (whales, elephants, humans, birds such as wood ducks). Success through high survival of each offspring.','Both strategies are equally successful because each replaces the parents over time.','<b>Mating systems</b>: monogamy (one male pairs with one female), polygyny (one male, several females), polyandry (one female, several males).']);
NOTE('Social organisation',['<b>Territory</b> – an area defended by an animal or group against others of the same species (often marked with scent, e.g. spider monkeys).','<b>Dominance hierarchy</b> (pecking order) – a ranking in a group. Dominant animals get first access to food and mates; submissive signals (lowering body, avoiding eye contact) reduce fighting and injury, keeping the group stable.','Group living advantages: protection from predators, cooperative hunting, finding food, care of young. Disadvantages: competition for food and mates, spread of disease and parasites, easier for predators to see.','Social insects (bees, ants, termites) have castes with division of labour: one queen reproduces; workers are sterile. Risk: if the queen dies or disease spreads the colony can collapse and genetic variation is low; coping: rearing new queens, swarming, many drones, hygiene behaviour.','Baboons: males on the edges protect females and infants in the centre – the hierarchy helps the troop survive.']);

Q('What is innate behaviour?','Behaviour that is inherited and performed correctly the first time without learning','Behaviour learned by copying parents','Behaviour that changes with experience','Behaviour only shown by humans','Innate behaviour is genetically programmed, e.g. a newborn suckling or the waggle dance.','Definition');
Q('A bee performs the waggle dance to show other bees the direction of food. It comes naturally to bees. What type of behaviour is this?','Innate behaviour','Learned behaviour','Imprinting','Habituation','The waggle dance is inherited and does not need to be learned.',2020);
Q('A newborn baby suckles milk from a bottle. What type of behaviour is this?','Innate (reflex) behaviour','Learned behaviour','Insight learning','Taxis','Suckling is an inborn reflex present at birth.',2025);
Q('Birds drop fewer blades of grass as they gain more experience in nest building. This is an example of…','learned behaviour','innate behaviour','kinesis','a circadian rhythm','The behaviour improves with experience, so it is learned.',2023);
Q('Which is a feature of learned behaviour?','It develops through experience and can be modified','It is identical in all members of a species','It is present at birth','It cannot change during an animal’s life','Learned behaviour depends on the individual’s experience.',2019);
Q('What is a taxis?','A directional movement towards or away from a stimulus','A change in speed of movement with no direction','A daily rhythm of activity','Movement between breeding and feeding areas','Taxis is directional; kinesis is non-directional.','Definition');
Q('What is a kinesis?','A non-directional change in speed or rate of turning in response to the intensity of a stimulus','A movement directly towards a stimulus','A learned response to a reward','A seasonal movement','In kinesis the animal does not move in a set direction; it changes speed or turning rate.',2020);
Q('Euglena use photoreceptors in their eyespot to swim towards light. What is this response?','Positive phototaxis','Negative phototaxis','Orthokinesis','Klinokinesis','Movement towards light = positive phototaxis.',2024);
Q('Maggots compare light on each side and always turn towards the darker side, away from light. What is the full name of this response?','Negative phototaxis','Positive phototaxis','Orthokinesis','Positive chemotaxis','Directional movement away from light = negative phototaxis.',2018);
Q('Why is the maggots’ movement away from light NOT a kinesis?','It is directional – they turn away from the light source, not just change speed','They move faster in the light','They move randomly','They only move at night','A kinesis has no direction; the maggots’ movement is oriented to the light.',2018);
Q('Orthokinesis refers to…','a change in speed of movement in response to a stimulus','a change in the rate of turning','moving towards a stimulus','moving towards a chemical','Ortho = speed; klino = turning.','Definition');
Q('What is the adaptive value of kinesis to woodlice or bugs under a lifted rock?','They move quickly in unfavourable (dry, bright) conditions and slow down in favourable (dark, damp) places, so they stay where they survive','They move towards predators','They find mates using light','It helps them migrate long distances','Kinesis keeps them in damp, dark places, preventing drying out and predation.',2022);
Q('A porcupine fish gulps water to nearly double its size when a predator comes near. This is an adaptation that…','makes it too big and spiny for the predator to swallow, so it survives','helps it catch prey','helps it migrate','attracts mates','Inflating is a defence behaviour against predation.',2018);
Q('What is a circadian rhythm?','A biological rhythm with a cycle of about 24 hours','A rhythm that follows the tides','A yearly rhythm','A rhythm that lasts about one month','Circa = about, dies = day.',2021);
Q('What is a biological clock?','An internal timing mechanism that controls an organism’s rhythmic activities','A clock used by biologists','The time an animal takes to grow','A type of migration','The biological clock is endogenous and controls cycles like sleep–wake.','Definition');
Q('What is a zeitgeber?','An environmental cue (e.g. light or temperature) that resets the biological clock','An internal clock','An animal active at night','A type of learned behaviour','Zeitgeber means “time-giver” in German.',2018);
Q('Endogenous rhythms are…','generated inside the organism and continue in constant conditions','caused only by outside cues','learned from parents','only found in plants','Endogenous = from within.','Definition');
Q('The free-running period is…','the natural length of a rhythm when an animal is kept in constant conditions','the time an animal spends running','the time between two meals','the length of the day outside','Without zeitgebers the clock runs at its own natural period.','Definition');
Q('A cockroach kept in constant darkness starts its activity a little later each day. This shows that…','its free-running period is longer than 24 hours','it has no biological clock','light is not a zeitgeber','it is diurnal','A sloping actogram means the natural period is slightly more than 24 h.',2022);
Q('What is the graph showing an animal’s activity over many days called?','An actogram','A karyotype','A pedigree','A food web','Actograms plot activity against time of day for successive days.',2022);
Q('A phase shift is…','a change in the timing of a rhythm, e.g. after the light cycle changes or jet lag','a change in the length of a day','the loss of the biological clock','the direction of migration','Phase shifts reset when activity happens.','Definition');
Q('Corals spawn once a year on a November night after a full moon, also using water temperature and day length. Which type of rhythm is this?','Lunar and annual (circannual) rhythm','Circadian rhythm only','Tidal rhythm only','Kinesis','Spawning follows the moon and the time of year.',2020);
Q('How is a biological clock useful for a nocturnal animal?','It anticipates dusk so the animal is ready to feed at night when it is safer from predators','It keeps the animal awake all day','It makes the animal diurnal','It stops the animal from sleeping','The clock prepares the animal before conditions change.',2023);
Q('Why do people get jet lag after flying across time zones?','Their biological clock is not yet in sync with the new local time','They lose their biological clock','Light no longer affects them','Their free-running period becomes 12 hours','The internal clock needs several days to re-entrain to new zeitgebers.',2025);
Q('Why is a biological clock needed for long-distance navigation using the sun?','The sun’s position changes during the day, so the animal must know the time to use it as a compass','The sun never moves','It helps animals see at night','It measures distance travelled','A sun compass needs time compensation from the clock.',2017);
Q('Salmon return to the stream where they were born using the Earth’s magnetic field and smell. This behaviour is called…','homing','hibernation','kinesis','imprinting only','Homing is returning to a specific place.',2021);
Q('Which environmental cue could trigger monarch butterflies to migrate south?','Shorter day length and cooler temperatures in autumn','Longer days in spring','A full moon','High tide','Changing photoperiod and temperature signal the approach of winter.',2017);
Q('What is an ecological niche?','The role and position of a species in its ecosystem, including habitat, food and interactions','The place where an animal sleeps only','A group of the same species','The number of offspring produced','The niche describes how a species “fits” into the ecosystem.',2019);

Q('An eagle and a fox fight over the same rabbit. This is an example of…','interspecific competition','intraspecific competition','mutualism','commensalism','Two different species compete for the same food.',2021);

Q('Fifteen species of anole lizards live in the same forest, each in a different microhabitat. This is called…','resource partitioning (niche differentiation)','competitive exclusion','interspecific mutualism','the bottleneck effect','Each species uses a slightly different realised niche, reducing competition.',2020);

P('Identify one feature of homing given in the salmon example.','Salmon return to the exact stream where they were born (a specific site) to spawn; they navigate using the Earth’s magnetic field and then smell.','2021');
P('Define circadian rhythm.','A biological rhythm of activity with a period of about 24 hours, controlled by an internal biological clock (e.g. sleep–wake cycle).','2021');
P('Define interspecific competition and discuss how it contributes to species redistribution.','Interspecific competition is competition between individuals of different species for the same limited resource (food, space, light). When two species compete, the stronger competitor gains more of the resource. The weaker species may be excluded (competitive exclusion) or forced to move into a different habitat or niche, so species become redistributed. Example: an invasive plant such as African tulip outcompetes native trees, which disappear from those areas; anole lizards divide the forest into microhabitats; barnacle species on rocks occupy different zones. Over time this can lead to resource partitioning and changes in the distribution of species in an ecosystem.','2021');
P('State one feature of social organisation shown by pigs, and list one advantage and one disadvantage of group living.','Feature: pigs form a social hierarchy with friendly relationships and recognise strangers by sight and smell. Advantage: protection from predators / cooperation. Disadvantage: competition for food and space / spread of disease.','2021, 2017');
P('Define monogamous mating and list two features of K-strategists.','Monogamous mating – one male mates with one female, often forming a pair bond. K-strategists: few offspring, large offspring, long gestation, high parental care, long life, stable population near carrying capacity.','2022');
P('Describe the adaptive value of orthokinesis to woodlice.','Woodlice move faster in unfavourable conditions (high temperature, dry, bright) and slow down in favourable, cool, damp conditions. As a result they spend more time in damp, dark places, which prevents them from drying out and helps them avoid predators.','2022, 2020');
P('Explain the cockroach’s activity using the terms free-running, phase shift and zeitgeber (actogram).','For days 1–5 light acts as the zeitgeber, entraining the cockroach so activity starts at the same time each evening (onset of dark). After light is removed the rhythm is free-running: the endogenous clock runs at its natural period, which is slightly longer than 24 h, so activity starts a little later each day, giving a sloping pattern. This gradual change in timing is a phase shift (delay). This shows the rhythm is endogenous but normally reset by light.','2022, 2024');
P('Define zeitgeber and discuss how an endogenous rhythm benefits the hermit crab.','Zeitgeber – an external cue, e.g. sunrise/sunset, that resets the biological clock. Endogenous – generated internally. The hermit crab is nocturnal (active in the dark part of the actogram). An endogenous rhythm allows it to anticipate nightfall and emerge at the right time even when it cannot sense light (e.g. in a burrow or under rocks), so it feeds when predators are fewer and it avoids drying out in the day. The clock keeps running in constant darkness (free-running), showing it does not depend only on cues.','2018');
P('Name the three most dominant wolves and explain how dominance and submissive behaviours maintain hierarchies.','Most dominant: C, F, E. Dominant animals assert rank through threats and biting; lower-ranked wolves show submissive behaviour (tail down, rolling over, avoiding eye contact). Because each wolf accepts its rank, serious fights are avoided, energy is saved, and access to food and mates is organised, keeping the pack stable and cooperative for hunting.','2018');
P('Define ecological niche and describe the niche of a coconut crab.','Niche – the role and position of a species in its ecosystem (habitat, food, activity, interactions). Coconut crab: a large land crab living in burrows/crevices near the coast; mostly nocturnal; climbs coconut trees; feeds on coconuts, fruit, seeds and dead animals (scavenger); has few competitors because of its specialised diet.','2019');
P('Identify whether Species X (stable population, few large offspring, long gestation) is r- or K-selected and explain how its reproductive behaviour influences survival.','K-selected. Producing few offspring with long gestation means each is well developed at birth and receives parental care, so the survival rate of each offspring is high. The population stays near carrying capacity and is stable, but recovers slowly if numbers fall.','2019');
P('Discuss how r- and K- reproductive strategies influence survival (oysters vs whales; mouse vs whale; elephants).','Oysters/mice are r-strategists: many offspring, no or little care; most die, but huge numbers mean some survive – suits unstable environments. Whales/elephants are K-strategists: one calf every few years, long gestation, long parental care and group protection – most offspring survive. Risks: r – high mortality; K – slow recovery. Both are equally successful because each replaces the adults and keeps the species going.','2017, 2023, 2025');
P('Using a named organism, discuss the implications of environmental change on the biological clock and survival.','Example: sea turtles. Artificial light from coastal development (light pollution) disrupts their natural cues; hatchlings use moonlight on the sea to find the ocean but move towards street lights instead, and nesting females avoid lit beaches. The disrupted rhythm/orientation leads to dehydration, predation and fewer successful hatchlings, reducing the population. Similarly warming seas can shift coral spawning times.','2019');
P('Discuss the social organisation of a social insect, how it threatens extinction and how members cope.','Honeybees: one queen lays all the eggs; thousands of sterile female workers (forage, nurse, guard); male drones mate. Threat: only the queen reproduces, so if she dies or disease/pesticides attack the colony, it can collapse, and genetic diversity is low. Coping: workers rear a new queen from a young larva fed royal jelly; the queen mates with many drones, increasing variation; colonies swarm to form new colonies; hygienic behaviour removes diseased brood.','2020');
P('Explain how the competitive exclusion principle affects Paramecium aurelia and P. caudatum, and how it leads to niche partitioning among lizards.','When grown separately both species grow well, but together they compete for the same food; P. aurelia uses resources more efficiently, so P. caudatum declines to extinction – two species with identical niches cannot coexist. For lizards, competition pushed species to use different parts of the habitat (tree trunks, twigs, ground), so each occupies a narrower realised niche and they can coexist.','2023, 2025');
P('Describe the role of the biological clock in the human body.','It controls the circadian sleep–wake cycle, body temperature and hormone release (e.g. melatonin at night), keeping body functions in step with day and night. Light resets it daily; after travel it is out of sync, causing jet lag.','2025');

S(2,'Gene Expression','DNA, replication, protein synthesis, the genetic code, mutations, chromosome changes and patterns of inheritance.');
NOTE('DNA and the genome',['<b>Genome</b> – the complete set of genetic material (DNA) of an organism, including all its genes. The human genome has about 3 billion base pairs, around 20 000 genes, in 23 pairs of chromosomes; most DNA does not code for proteins.','DNA is a <b>double helix</b> of two antiparallel strands (5′→3′ and 3′→5′). Each nucleotide = deoxyribose sugar + phosphate + base. Sugar–phosphate backbone on the outside; bases paired by hydrogen bonds inside: A–T (2 bonds), C–G (3 bonds).','A <b>gene</b> is a section of DNA that codes for a polypeptide/protein. An <b>allele</b> is an alternative form of a gene.']);
NOTE('DNA replication',['<b>Semi-conservative replication</b>: each new DNA molecule contains one original (parent) strand and one newly made strand.','<b>Helicase</b> unwinds and unzips the double helix by breaking hydrogen bonds, forming a replication fork.','<b>DNA polymerase</b> adds complementary nucleotides to the new strand, only in the 5′→3′ direction, and proofreads.','<b>Leading strand</b> – made continuously towards the fork. <b>Lagging strand</b> – made discontinuously away from the fork in short pieces called <b>Okazaki fragments</b>.','<b>DNA ligase</b> joins the Okazaki fragments (seals the sugar–phosphate backbone). Primase adds RNA primers to start synthesis.','Replication problems: wrong base inserted (mismatch) not corrected by proofreading, bases added or skipped, damage from mutagens (UV, radiation, chemicals) – these cause mutations.']);
NOTE('Protein synthesis',['<b>Protein synthesis</b> – making a protein (polypeptide) from the instructions in a gene. <b>Central dogma</b>: DNA → (transcription) → mRNA → (translation) → protein.','<b>Transcription</b> (nucleus): RNA polymerase unwinds DNA and makes a complementary mRNA copy of the template strand (U instead of T). The mRNA leaves the nucleus through nuclear pores.','<b>Translation</b> (ribosome in cytoplasm): the ribosome reads mRNA <b>codons</b> (3 bases). <b>tRNA</b> carries a specific amino acid and has an <b>anticodon</b> that pairs with the codon. Amino acids are joined by peptide bonds until a stop codon is reached.','mRNA function: carries the genetic code from DNA in the nucleus to the ribosome. rRNA forms the ribosome.']);
NOTE('The genetic code',['<b>Codon</b> – a sequence of three bases on mRNA that codes for one amino acid or a stop signal. 64 codons, 20 amino acids.','Features: triplet, non-overlapping, universal, has a start codon (AUG, methionine) and three stop codons (UAA, UAG, UGA).','<b>Redundant (degenerate)</b>: most amino acids have more than one codon, e.g. CAU and CAC both code for histidine; the 3rd base often varies. This protects against some mutations (silent mutations).','Using the code: read the first base on the left, the second along the top, the third on the right, e.g. GAU = Asp, CAU = His, UGG = Trp.']);
NOTE('Proteins',['Structure: primary (amino acid sequence) → secondary (α-helix, β-sheet) → tertiary (3D folding) → quaternary (more than one polypeptide chain). The shape determines the function.','Keratin: several helical polypeptide chains (quaternary); many sulfur-containing cysteines form disulfide bridges → strong, tough (hair, nails, skin).','Haemoglobin: 4 polypeptide chains (2 α, 2 β) each with a haem group containing iron (Fe^{2+}) that binds oxygen – transports O_2.','Collagen: three polypeptide chains twisted into a triple helix, cross-linked into fibres → great tensile strength for skin, tendons, bone.','Roles of proteins: enzymes (catalysts), structure, transport (haemoglobin), hormones (insulin), antibodies (defence), movement (muscle proteins).']);
NOTE('Mutations',['<b>Mutation</b> – a permanent change in the DNA base sequence (gene mutation) or in chromosome structure/number (chromosome mutation). The only source of new alleles.','Point/gene mutations: <b>substitution</b> (one base replaced), <b>insertion/addition</b>, <b>deletion</b>. Insertions and deletions cause a <b>frameshift</b> – every codon after it changes.','<b>Silent</b> – new codon codes the same amino acid. <b>Missense</b> – codon changes to one coding a different amino acid (e.g. sickle cell: glutamic acid → valine). <b>Nonsense</b> – codon changes to a STOP codon → short, usually non-functional protein.','Chromosome mutations: deletion, duplication, inversion, translocation.','Causes (mutagens): UV light, X-rays and gamma radiation, chemicals (tar in tobacco smoke, some pesticides), some viruses, and random errors in replication.']);
NOTE('Chromosome number changes',['<b>Non-disjunction</b> – failure of homologous chromosomes or chromatids to separate during meiosis, producing gametes with an extra or missing chromosome.','<b>Aneuploidy</b> – having an abnormal number of chromosomes (one more or one less), e.g. 2n+1 (trisomy) or 2n−1 (monosomy).','Down syndrome – trisomy 21 (47 chromosomes): characteristic facial features (upward-slanting eyes, flat face), short stature, learning difficulties, heart defects, weak muscle tone. Turner syndrome – 45,X0 female: short, infertile. Klinefelter syndrome – 47,XXY male: tall, infertile, some breast development (a male tortoiseshell cat is XXY).','<b>Polyploidy</b> – having more than two complete sets of chromosomes (3n triploid, 4n tetraploid). Caused by complete non-disjunction. Common in plants: larger cells and fruits, vigour, stress/disease tolerance, and instant speciation. Triploids (seedless watermelon, bananas) are sterile because chromosomes cannot pair evenly in meiosis. Examples: wheat (hexaploid), cotton and Salmonidae fish (tetraploid).']);
NOTE('Patterns of inheritance',['<b>Complete dominance</b> – dominant allele masks recessive. <b>Heterozygous</b> – two different alleles (Bb); homozygous – two identical alleles.','<b>Test cross</b>: an organism with the dominant phenotype is crossed with a homozygous recessive (bb). All dominant offspring → parent BB; 1:1 → parent Bb.','<b>Incomplete dominance</b> – heterozygote has an intermediate (blended) phenotype: red × white snapdragons → pink; F2 1 red : 2 pink : 1 white.','<b>Co-dominance</b> – both alleles fully expressed together: checkered chickens (black and white feathers), AB blood group, roan cattle, tortoiseshell cats (X^{B}X^{G}).','<b>Multiple alleles</b> – more than two alleles exist for a gene in the population (ABO blood group: I^{A}, I^{B}, i).','<b>Sex-linked genes</b> – on the X chromosome (e.g. haemophilia, colour blindness); males (XY) are affected more often because they have only one X. <b>Linked genes</b> – on the same chromosome, inherited together unless separated by crossing over.','<b>Epistasis</b> – one gene masks or modifies the expression of another gene. Recessive epistasis (mouse coat, Labradors: ee = golden) gives 9:3:4. Complementary genes (both dominant alleles needed, e.g. purple flowers) give 9:7. Supplementary genes give 9:3:4. Dominant epistasis gives 12:3:1.','<b>Pleiotropy</b> – one gene affects several different characteristics (e.g. seed coat colour gene also affects flower and leaf axil colour; sickle cell).','<b>Metabolic pathway</b> – a series of enzyme-controlled reactions, each enzyme coded by a gene. PKU: missing enzyme (phenylalanine hydroxylase) so phenylalanine is not converted to tyrosine; it builds up and damages the brain; autosomal recessive; treated with a low-phenylalanine diet.','Environment affects phenotype: temperature (Himalayan rabbit/Siamese cat dark fur on cold extremities), soil pH (hydrangea flower colour), nutrition (height), sunlight (skin colour, plant growth).']);

Q('Multiple alleles means…','more than two alleles exist for one gene in a population','a gene has two alleles','many genes control one trait','an organism has many chromosomes','ABO blood groups have three alleles.',2020);
Q('Which is a feature of sex-linked conditions like haemophilia?','The gene is on the X chromosome, so males are more often affected','It is only found in females','It is on chromosome 21','It is caused by a virus','Males have only one X, so one recessive allele shows.',2019);
Q('Linked genes are…','genes on the same chromosome that tend to be inherited together','genes only on the X chromosome','genes that code for the same protein','genes on different chromosomes','They separate only if crossing over occurs between them.',2019);
Q('Epistasis is…','when one gene masks or changes the expression of another gene','one gene affecting many characteristics','both alleles expressed','a mutation','E.g. ee Labradors are golden whatever the B gene.',2022);
Q('A dihybrid cross showing recessive epistasis gives the phenotype ratio…','9:3:4','9:3:3:1','3:1','1:2:1','E.g. agouti : black : albino mice = 9:3:4.',2022);
Q('Two heterozygous black Labradors (BbEe × BbEe) have puppies. The expected ratio black : brown : golden is…','9 : 3 : 4','9 : 7','3 : 1','1 : 2 : 1','B_E_ black, bbE_ brown, _ _ee golden.',2017);
Q('Complementary genes give which dihybrid ratio?','9 : 7','9 : 3 : 4','12 : 3 : 1','15 : 1','Both dominant alleles are needed for the trait.',2025);
Q('Pleiotropy is…','one gene affecting several different characteristics','many genes controlling one trait','one gene masking another','two alleles both shown','E.g. one gene controlling seed coat, flower and leaf axil colour.',2019);
Q('A metabolic pathway is…','a series of enzyme-controlled reactions, each enzyme coded by a gene','a single chemical reaction','the path of food through the gut','a type of mutation','PKU affects the phenylalanine → tyrosine pathway.',2021);
Q('Which is a characteristic of PKU?','Phenylalanine builds up because the enzyme to convert it to tyrosine is missing','It is caused by an extra chromosome','It is a viral disease','It only affects plants','It can damage the brain; treated with a special diet.',2021);
Q('Which is an example of the environment affecting phenotype?','Hydrangea flower colour depends on soil pH','Blood group','Eye colour determined by genes','Number of chromosomes','Temperature, nutrition and light also change phenotype.',2019);

P('Identify one characteristic of replication and describe how DNA replication problems may arise.','Characteristic: semi-conservative – each daughter DNA has one parent and one new strand. Problems: DNA polymerase may insert the wrong base (mismatch) and fail to proofread it; bases can be added or skipped; mutagens (UV, radiation, chemicals) damage bases. Uncorrected errors become permanent mutations passed to daughter cells.','2021, 2019, 2023');
P('Define protein synthesis and explain the relationship between transcription and translation.','Protein synthesis is the production of proteins using the code in DNA. Transcription (nucleus): RNA polymerase uses one DNA strand as a template to make complementary mRNA. The mRNA carries the code to the ribosome. Translation (cytoplasm): the ribosome reads mRNA in codons; tRNA with matching anticodons brings amino acids, which are joined by peptide bonds until a stop codon. Transcription produces the message that translation uses, so both are needed. The code is redundant – several codons can code for the same amino acid.','2021, 2017, 2019');
P('Describe the use of the genetic code to identify a codon/amino acid (or a STOP codon).','Take the mRNA codon, e.g. UGG. Find the first base (U) on the left, the second base (G) along the top, and the third base (G) on the right; the box gives tryptophan (Trp). STOP codons (UAA, UAG, UGA) are marked “Stop” in the table and end translation.','2019, 2022, 2025');
P('Describe the redundant nature of the genetic code with an example.','Redundant/degenerate means most amino acids are coded by more than one codon. From the table, CAU and CAC both code for histidine; CGU, CGC, CGA and CGG all code for arginine. Usually only the third base differs, so a mutation in the 3rd base may have no effect (silent mutation).','2020, 2024');
P('Define semi-conservative replication and explain the roles of helicase, DNA polymerase and ligase (leading and lagging strands).','Semi-conservative: each new DNA contains one original and one new strand. Helicase unwinds and unzips the helix by breaking hydrogen bonds at the replication fork. DNA polymerase adds complementary nucleotides 5′→3′: on the leading strand continuously towards the fork; on the lagging strand in short Okazaki fragments away from the fork. DNA ligase joins the Okazaki fragments to form a continuous strand. The enzymes work in sequence: unzip → build → join.','2022, 2019, 2025');
P('Describe the structure of DNA (genome).','Genome – the complete set of DNA of an organism. DNA is a double helix; each strand is a chain of nucleotides (deoxyribose sugar, phosphate, base). The strands are antiparallel; bases pair A–T and C–G by hydrogen bonds.','2022, 2018');
P('Explain how the genome determines the full characteristics of an organism.','The genome contains all genes; each gene codes for a protein (enzyme, structural, hormone). Proteins control the structure and chemical reactions of cells, so the combination of genes and their expression determines all characteristics (with environmental influence).','2018');
P('Explain how the structure of proteins (keratin, collagen, haemoglobin) determines function.','Keratin – several helical chains cross-linked by disulfide bridges from sulfur-containing amino acids → strong, insoluble protective layer in skin/hair. Collagen – three chains in a triple helix, cross-linked into fibres → high tensile strength for skin, bone, tendons. Haemoglobin – 4 chains, each with a haem group with iron that binds O_2 → carries oxygen.','2018, 2020, 2024');
P('With two examples, explain the roles proteins play in our bodies.','Enzymes (e.g. amylase) speed up chemical reactions such as digestion; haemoglobin transports oxygen in red blood cells; antibodies fight infection; insulin (hormone) controls blood sugar; keratin and collagen give structure and strength.','2023');
P('Define mutation, name the mutation types, and explain causes of gene mutations.','Mutation – a permanent change in DNA. Types: substitution (one base swapped), insertion (added base – frameshift), deletion (base lost – frameshift). Causes: errors during replication, and mutagens such as UV light, X-rays, gamma rays, chemicals (tar, benzene), some viruses.','2017, 2019, 2021');
P('Differentiate between a missense and a nonsense codon/mutation.','Missense: a base change produces a codon for a different amino acid, so the protein has one wrong amino acid (e.g. sickle cell). Nonsense: the change produces a STOP codon, so translation ends early and a shortened, usually non-functional protein is made. Nonsense usually has a bigger effect.','2020, 2023');
P('Define aneuploidy and explain its effects using examples (sex chromosome disorders).','Aneuploidy – an abnormal number of chromosomes (one extra or missing) due to non-disjunction in meiosis. Down syndrome (trisomy 21, 47): flat face, slanting eyes, short, learning difficulties, heart defects. Turner (45,X0): female, short, webbed neck, infertile. Klinefelter (47,XXY): male, tall, small testes, infertile. Extra or missing genes upset development.','2021, 2018, 2023');
P('Define polyploidy/tetraploid and discuss advantages of polyploidy in plants (seedless watermelon, bananas).','Polyploidy – more than two complete sets of chromosomes; tetraploid = 4n. Advantages: larger cells, bigger fruit and flowers (gigantism), greater vigour, tolerance of drought, disease and cold, and instant speciation. Crossing tetraploid × diploid gives sterile triploid seedless watermelons; triploid bananas are seedless. Wheat, cotton, strawberries are successful polyploid crops.','2018, 2022, 2024, 2025');
P('Define co-dominance and explain why checkered chickens show co-dominance, not complete or incomplete dominance.','Co-dominance – both alleles are fully expressed in the heterozygote. BW chickens have separate black feathers and white feathers. With complete dominance only one colour would appear; with incomplete dominance a blended grey would appear. Both colours showing separately = co-dominance.','2018, 2017');
P('Discuss incomplete dominance using a Punnett square (red × white flowers).','Incomplete dominance: neither allele is completely dominant, so the heterozygote is intermediate. Parents RR (red) × WW (white) → all RW pink. Pink × pink → 1 RR red : 2 RW pink : 1 WW white. Compare co-dominance, where both colours show separately (roan cattle, AB blood).','2023, 2025');
P('Describe the genotypes of the parents in a monohybrid test cross.','One parent shows the dominant phenotype with unknown genotype (AA or Aa); the other is homozygous recessive (aa). If all offspring are dominant → AA; if half are recessive → Aa.','2021');
P('Compare linked genes and sex-linked genes.','Linked genes are on the same chromosome (any chromosome) and are inherited together unless crossing over separates them. Sex-linked genes are on a sex chromosome (usually X), so inheritance differs between males and females; males (XY) show recessive traits more often. Sex-linked genes are a special case of linked genes (e.g. fruit fly eye and body colour).','2019');
P('Define epistasis and discuss the 9:3:4 ratio in mice; complementary genes and the Labrador cross.','Epistasis – one gene masks the expression of another. Mice AaCc × AaCc: C is needed for any pigment; cc = albino whatever the A gene. A_C_ agouti 9, aaC_ black 3, _ _cc albino 4 → 9:3:4. Labradors BbEe × BbEe → black 9 : brown 3 : golden 4 (ee masks colour). Complementary genes need both dominant alleles for the trait → 9:7.','2022, 2017, 2025');
P('Explain the difference between complementary and supplementary genes.','Complementary genes: two genes work together and a dominant allele of both is needed to produce the trait (e.g. purple sweet-pea flowers) – ratio 9:7. Supplementary genes: one gene produces a trait on its own and the second gene modifies it only if the first is present (e.g. coat colour in mice/rats) – ratio 9:3:4.','2020');
P('State one feature of pleiotropy.','A single gene affects several different, apparently unrelated phenotypic traits, e.g. the gene for seed coat colour also affects flower and leaf axil colour; the sickle cell allele affects red cells, anaemia and malaria resistance.','2019, 2024');
P('Discuss the effects of the environment on the expression of genotype.','Genotype – the alleles present; phenotype – observable traits (genotype + environment). Temperature: Himalayan rabbits/Siamese cats have dark fur only on cold extremities because the pigment enzyme works only at low temperature. Soil pH: hydrangeas are blue in acid soil and pink in alkaline soil. Nutrition affects height; sunlight affects skin tanning and plant growth. Same genotype can give different phenotypes.','2019, 2024');
P('Define metabolic pathway and describe one characteristic of PKU.','Metabolic pathway – a sequence of enzyme-controlled reactions, each enzyme coded by a gene. PKU: a recessive mutation means the enzyme phenylalanine hydroxylase is missing, so phenylalanine is not converted to tyrosine; it accumulates and causes brain damage/learning disability; treated by a low-phenylalanine diet from birth.','2021');
P('State the genotype of the tortoiseshell female cat and name the condition of a male tortoiseshell.','Female tortoiseshell: X^{B}X^{G}. A male tortoiseshell is XXY (Klinefelter syndrome) caused by non-disjunction of the X chromosomes during meiosis in a parent.','2017');

S(3,'Biotechnology Applications','Gene cloning, transgenesis and GMOs, PCR, gel electrophoresis and DNA profiling, and their impacts.');
NOTE('Recombinant DNA and gene cloning',['<b>Recombinant DNA</b> – DNA made by joining DNA from two different sources.','<b>Gene cloning</b> – making many identical copies of a gene, usually by inserting it into a vector (plasmid) and growing it in bacteria.','<b>Restriction enzymes</b> cut DNA at specific base sequences (recognition sites), often leaving “sticky ends”. <b>DNA ligase</b> joins DNA pieces.','Using bacterial plasmids (e.g. to make insulin): 1. Isolate the gene (cut out with a restriction enzyme) and a plasmid. 2. Cut the plasmid with the same restriction enzyme so the sticky ends match. 3. Join gene and plasmid with DNA ligase → recombinant plasmid. 4. Insert into bacteria (transformation). 5. Select and grow the bacteria – they multiply rapidly, copying the gene and making the protein.']);
NOTE('Transgenesis and GMOs',['<b>Transgenesis</b> – transferring a gene from one species into another, producing a <b>transgenic</b> organism (GMO) that expresses the new trait.','<b>Agrobacterium tumefaciens</b> – a soil bacterium whose Ti plasmid naturally inserts DNA into plant chromosomes, so it is used as a vector for plants. Stages: identification of the desired gene → isolation (cutting the gene out with restriction enzymes and inserting it into the Ti plasmid) → transformation (infecting plant cells, which grow into transgenic plants).','<b>Gene gun (biolistics)</b> – tiny gold or tungsten particles coated with DNA are fired into plant cells; used for Bt maize (a gene from <i>Bacillus thuringiensis</i> gives pest resistance).','<b>Microinjection</b> – DNA is injected into the pronucleus of a fertilised egg, which is implanted into a surrogate mother (transgenic mice, used to study human diseases or produce medicines).','Examples: Bt maize, herbicide-resistant soy/corn (GM crops), insulin-producing bacteria, fast-growing GM tilapia or salmon.','Gene pool impacts – positive: adds useful new alleles (disease/pest resistance, higher yield). Negative: GM stock are genetically uniform (low diversity), escaped GM animals can interbreed with or outcompete wild populations, spreading transgenes and reducing natural diversity.']);
NOTE('PCR, gel electrophoresis and DNA profiling',['<b>PCR – Polymerase Chain Reaction</b>: makes millions of copies of a small DNA sample. Cycle: denaturation (~95 °C, heat breaks hydrogen bonds and separates the strands) → annealing (~55 °C, primers bind) → extension (~72 °C, Taq polymerase builds new strands). Each cycle doubles the DNA.','<b>STRs (short tandem repeats)</b> – short DNA sequences (2–6 bases) repeated many times at a locus; the number of repeats differs between people, so STRs are used in DNA profiling.','<b>Gel electrophoresis</b> – separates DNA fragments by size. DNA (negatively charged) is placed in wells at the cathode end; an electric current makes it move towards the positive anode; smaller fragments move further. The DNA is stained to show bands.','<b>DNA profiling (fingerprinting)</b> – producing a pattern of DNA bands unique to an individual: extract DNA → amplify STRs by PCR → separate by gel electrophoresis → compare band patterns.','Uniqueness: apart from identical twins, no two people have the same DNA sequence or STR pattern.','Uses: forensic (match crime-scene DNA to suspects), identifying disaster victims (2004 tsunami), paternity disputes (every band in a child must match either the mother or the father), medical: diagnosing genetic diseases, matching organ/bone-marrow donors, identifying infections.']);

Q('Recombinant DNA is…','DNA made by combining DNA from two different sources','DNA that has mutated','DNA copied by PCR only','RNA made from DNA','Used in gene cloning and transgenesis.','Definition');
Q('Gene cloning is…','making many identical copies of a gene, usually using a vector such as a plasmid','cloning a whole animal','mixing two species','cutting DNA into pieces','The gene is copied every time the bacteria divide.',2018);
Q('What is a plasmid?','A small circular piece of DNA found in bacteria, used as a vector','An enzyme that cuts DNA','A protein','A type of virus','Plasmids replicate independently inside bacteria.','Definition');
Q('Which enzyme cuts DNA at specific sites during recombinant DNA technology?','Restriction enzyme (endonuclease)','DNA ligase','Helicase','Amylase','Restriction enzymes recognise specific base sequences.',2023);
Q('Which enzyme joins the desired gene into the plasmid?','DNA ligase','Restriction enzyme','Taq polymerase','RNA polymerase','Ligase seals the sugar–phosphate backbone.','Definition');
Q('What are the first two steps in using bacterial plasmids to copy a desired gene?','Isolate the gene and the plasmid, then cut both with the same restriction enzyme','Grow the bacteria, then add insulin','Heat the DNA, then add primers','Inject DNA into an egg, then implant it','Matching sticky ends allow the gene to join the plasmid.',2022);
Q('Transgenesis is…','transferring a gene from one species into another','copying DNA using PCR','separating DNA by size','breeding the best animals together','The organism produced is transgenic (a GMO).',2017);
Q('Scientists insert a foreign gene into an organism’s genome so it shows new properties. This process is called…','transgenesis (genetic engineering)','selective breeding','gel electrophoresis','DNA profiling','The organism expresses the inserted gene.',2024);
Q('Human genes are transferred into mice to study human diseases. The process is…','transgenesis','cloning by fission','natural selection','PCR','Transgenic mice are models for disease.',2020);
Q('What makes Agrobacterium tumefaciens useful in genetic engineering?','Its Ti plasmid can insert DNA into plant chromosomes','It kills plant pests','It cuts DNA','It makes PCR faster','It is a natural vector for plants.',2018);
Q('During the isolation stage of making transgenic Agrobacterium…','the desired gene is cut out with restriction enzymes and inserted into the Ti plasmid','plants are grown in soil','the gene is identified in a library only','bacteria are killed','Identification → isolation → transformation.',2018);
Q('A gene gun is…','a device that fires DNA-coated metal particles into cells','a tool to cut DNA','a machine for PCR','a microscope','Used in biolistics, e.g. Bt maize.',2019);
Q('In pronuclear microinjection…','DNA is injected into the nucleus of a fertilised egg, which is placed in a surrogate mother','DNA is fired into leaves','bacteria take up plasmids','DNA is separated in a gel','Used to make transgenic animals.',2017);
Q('Soy and corn modified for pest and herbicide resistance are called…','genetically modified (GM) crops / GMOs','hybrids','polyploids','clones','Their DNA has been changed by genetic engineering.',2024);
Q('Which is a positive impact of transgenesis on a population’s gene pool?','It introduces useful new alleles such as disease resistance','It always removes all variation','It stops all mutations','It prevents reproduction','New genes can improve survival and productivity.',2022);
Q('How could GM tilapia negatively affect the gene pool of wild tilapia?','Escaped GM fish could interbreed with or outcompete wild fish, reducing genetic diversity','They add more wild alleles','They cannot reproduce with wild fish','They make wild fish grow slowly only','Uniform GM genes can spread and replace natural variation.',2025);
Q('What do the letters PCR stand for?','Polymerase Chain Reaction','Protein Copy Reaction','Primary Cell Replication','Plasmid Clone Recombination','PCR copies DNA many times.',2017);
Q('In PCR, how are the two DNA strands separated?','By heating to about 95 °C, which breaks the hydrogen bonds','By adding helicase','By cooling to 4 °C','By adding salt','This step is called denaturation.',2017);
Q('Which method is used to produce larger amounts of DNA from a small sample?','PCR','Gel electrophoresis','Karyotyping','Microinjection','PCR amplifies DNA.',2018);
Q('A short tandem repeat (STR) is…','a short DNA sequence repeated many times in a row at a locus','a long gene','a type of RNA','a protein','The number of repeats varies between people.',2021);
Q('Gel electrophoresis is…','a technique that separates DNA fragments by size using an electric current in a gel','a way to copy DNA','a way to insert genes','a type of mutation','Smaller fragments travel further.',2019);
Q('In gel electrophoresis DNA moves towards the…','positive electrode (anode), because DNA is negatively charged','negative electrode','top of the gel','nearest well','Phosphate groups give DNA a negative charge.',2019);
Q('In gel electrophoresis, which DNA fragments travel furthest?','The smallest fragments','The largest fragments','All travel equally','The most negative fragments only','Small fragments move more easily through the gel.','Definition');
Q('The pattern of DNA bands produced from different individuals is called a…','DNA profile (DNA fingerprint)','karyotype','pedigree','actogram','Each person’s band pattern is unique.',2018);
Q('After the 2004 tsunami, victims were identified from specific DNA patterns. This process is…','DNA profiling','cloning','transgenesis','selective breeding','Profiles were matched to relatives or personal items.',2021);
Q('How is a DNA profile used in a parenting dispute?','Every band in the child’s profile must match a band from either the mother or the alleged father','The child must match only the mother','The father’s profile must be identical to the child’s','Only blood groups are compared','Half the bands come from each parent.',2018);
Q('What makes DNA suitable for identifying suspects and victims?','Each person’s DNA is unique (except identical twins)','Everyone has the same DNA','DNA changes every day','DNA is only found in blood','Unique STR patterns identify individuals.',2019);
Q('Which is a positive impact of DNA profiling on health services?','Diagnosing genetic diseases and matching organ or bone-marrow donors','Making people taller','Stopping all mutations','Replacing vaccines','Profiles help doctors identify genetic conditions and compatible donors.',2021);

P('Define short tandem repeat and identify the process used to identify tsunami victims.','STR – a short sequence of DNA bases (2–6) repeated many times in a row at a particular locus; the number of repeats varies between individuals. The process is DNA profiling (DNA fingerprinting).','2021, 2018');
P('Explain the positive impacts of DNA profiling on medical and health services.','It allows diagnosis of genetic diseases and carriers, identification of disease-causing bacteria/viruses, matching of organ and bone-marrow donors to reduce rejection, confirming identity of patients/victims, and paternity testing. This leads to earlier treatment, safer transplants and better health outcomes.','2021');
P('Define gene cloning and describe how bacterial plasmids are used to produce multiple copies of a gene (e.g. insulin).','Gene cloning – producing many identical copies of a gene. Steps: isolate the insulin gene and a plasmid; cut both with the same restriction enzyme, making complementary sticky ends; join them with DNA ligase (recombinant plasmid); insert into bacteria (transformation); select and culture the bacteria, which divide rapidly, copying the gene and producing insulin.','2018, 2017, 2022');
P('What makes Agrobacterium tumefaciens important and describe the isolation stage.','Agrobacterium can transfer part of its Ti plasmid DNA into the chromosomes of plant cells, so it acts as a natural vector. Isolation: the desired gene is cut from the donor DNA with restriction enzymes; the Ti plasmid is cut with the same enzyme; the gene is inserted and joined with ligase.','2018');
P('Define gene gun and describe how it is used to produce Bt maize.','A gene gun fires microscopic gold/tungsten particles coated with DNA into cells. The Bt toxin gene from Bacillus thuringiensis is coated onto particles and shot into maize cells; some cells take the gene into their chromosomes; these cells are grown into whole plants in tissue culture, which make the Bt toxin and resist insect pests.','2019');
P('Define transgenesis and describe microinjection; explain positive impacts of transgenesis on the gene pool.','Transgenesis – transferring a gene from one species to another. Microinjection: DNA is injected with a fine needle into the pronucleus of a fertilised egg, which is implanted into a surrogate mother; offspring carrying the gene are bred. Positive impacts: introduces new useful alleles (disease or pest resistance, faster growth, medicines), increasing productivity and survival.','2017, 2020, 2022');
P('Explain how GM tilapia could negatively affect the gene pool of its population.','GM tilapia are bred from few parents and are genetically uniform. If they escape and breed with wild tilapia, transgenes spread and wild alleles are lost; faster-growing GM fish may outcompete wild fish. This reduces genetic diversity, making the population more vulnerable to disease and environmental change.','2025');
P('Define gel electrophoresis and describe how DNA profiles are formed (PCR and electrophoresis).','Gel electrophoresis separates DNA fragments by size. DNA is extracted from a sample; STR regions are amplified by PCR (denature 95 °C, anneal primers, extend with Taq polymerase, repeated many cycles); fragments are loaded into wells in agarose gel; a current makes negative DNA move to the positive end, smaller fragments further; the DNA is stained and the band pattern (profile) is compared. A suspect whose bands match the crime-scene sample is linked to the crime.','2019, 2023, 2024, 2017');
P('Describe how a DNA profile may be used in parenting disputes.','Profiles of the mother, child and possible fathers are compared. Each band in the child must come from either the mother or the father. Bands not from the mother must match the true father; a man lacking these bands is excluded.','2018');
